<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>國七麻辣英語 L1–L3 家長解析</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#315efb;--line:#e5e7eb;--soft:#eef2ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.container{max-width:900px;margin:auto;padding:18px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.hero{background:linear-gradient(135deg,#253da1,#315efb);color:#fff;padding:24px 22px;border-radius:22px}
.hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:5px 0;opacity:.94;line-height:1.6}
.card{background:var(--card);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 4px 16px rgba(17,24,39,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-weight:800;margin:14px 0 8px}.label:first-child{margin-top:0}
button{border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px;font-family:inherit;touch-action:manipulation}
.primary{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:#374151}
.chip{min-height:44px;padding:9px 14px;border-radius:999px;background:#f3f4f6;border:1px solid var(--line);font-size:15px;color:#374151}
.chip.active{background:var(--soft);border-color:#b8c4ff;color:#1f3bb3}
input.text{flex:1 1 260px;min-width:0;font-size:17px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-family:ui-monospace,Menlo,monospace}
.hint{color:var(--muted);font-size:14px;line-height:1.55;margin-top:8px}
.warnmsg{color:#9f2828;font-size:14px;margin-top:6px}
.q{background:var(--card);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 3px 12px rgba(17,24,39,.06);break-inside:avoid;page-break-inside:avoid}
.qh{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-weight:900;font-family:ui-monospace,Menlo,monospace;font-size:16px;background:#1f2937;color:#fff;border-radius:8px;padding:4px 9px}
.badge{font-size:12px;font-weight:800;color:#315efb;background:#eef2ff;border-radius:999px;padding:5px 9px}
.unit{font-size:13px;color:var(--muted)}
.stem{font-size:18px;font-weight:800;line-height:1.5;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.passage{background:#fafafa;border-left:4px solid #cbd5e1;padding:12px 14px;border-radius:8px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
ol.opts{margin:6px 0;padding-left:0;list-style:none}
ol.opts li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
ol.opts li.correct{border-color:#2da364;background:#edf9f2;color:#0f6a39;font-weight:800}
.sec{margin-top:12px}.sec h4{margin:0 0 4px;font-size:14px;color:#374151}
.sec .body{line-height:1.7}
.zh{background:#fff8e6;border:1px solid #f3dca2;border-radius:10px;padding:10px 12px}
.ans{background:#edf9f2;border-radius:10px;padding:8px 12px;color:#0f6a39;font-weight:800}
ul.dn{margin:4px 0;padding-left:20px;line-height:1.6}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:#315efb}
.count{color:var(--muted);margin-top:12px}
.hidden{display:none!important}
@media (max-width:600px){.hero h1{font-size:22px}.container{padding:12px}}
@media print{
  body{background:#fff}.controls,.noprint{display:none!important}.hero{background:none;color:#000;padding:0}
  .q{box-shadow:none;border:1px solid #ccc}
  details summary{display:none}
}
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <h1>國七麻辣英語 L1–L3 家長解析</h1>
    <p>對照孩子測驗頁結果的「錯題代號」，輸入代號就能只看那幾題。</p>
    <p>代號格式：課-題型-序號，例如 L2-G03（V 單字、G 文法、R 閱讀、C 填空、W 造句）。</p>
  </section>

  <section class="card controls">
    <div class="label">輸入代號（逗號或空白分隔）</div>
    <div class="row">
      <input class="text" id="codeInput" placeholder="例：L2-G03, L1-C05" aria-label="題目代號" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button type="button" class="primary" id="codeApply">只看這些題</button>
      <button type="button" class="ghost" id="codeClear">清除</button>
    </div>
    <div class="warnmsg" id="codeWarn"></div>
    <div class="label">課別</div>
    <div class="row" id="lessonChips"></div>
    <div class="label">題型（可多選）</div>
    <div class="row" id="catChips"></div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="ghost" id="expandAll">展開全部課文</button>
      <button type="button" class="ghost" id="printBtn">列印目前清單</button>
    </div>
    <div class="count" id="count"></div>
  </section>

  <div id="list"></div>
</div>
<script>
"use strict";
const LESSONS = {"L1": "Who's That Young Man?", "L2": "What Are These?", "L3": "Let's Get Some Ideas from RoomGPT"};
const QUESTIONS = [{"code": "L1-V01", "category": "vocabulary", "type": "single_choice", "stem": "My father's brother is my ____.", "options": ["aunt", "uncle", "son", "cousin"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "Your father's brother is your uncle. An aunt is a woman (your mom's or dad's sister). A son is a boy child. A cousin is your uncle's or aunt's child.", "rubricEn": "", "difficulty": 1, "id": "L1-V01", "lesson": "L1", "explanationZh": "爸爸的哥哥或弟弟，英文就叫 uncle（叔叔、伯伯、舅舅都是 uncle）。最容易選錯的是 cousin：cousin 是跟你同一輩的堂表兄弟姊妹，不是長輩。", "rubricZh": "", "distractorNotes": ["分不清男女長輩：aunt 是女性長輩", "", "搞錯輩分：son 是下一代的兒子", "搞錯輩分：cousin 是同輩的堂表兄弟姊妹"]}, {"code": "L1-V02", "category": "vocabulary", "type": "single_choice", "stem": "Paul and Lily are Nick's parents. Paul is Lily's husband, and Lily is Paul's ____.", "options": ["sister", "daughter", "aunt", "wife"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "A husband and a wife are a married couple. Paul is the husband, so Lily is the wife. A sister, a daughter, and an aunt are not a husband's partner.", "rubricEn": "", "difficulty": 1, "id": "L1-V02", "lesson": "L1", "explanationZh": "husband 是先生、wife 是太太，兩個是一對。Paul 是 Lily 的先生，所以 Lily 是 Paul 的 wife。容易選錯 sister：姊妹不是夫妻喔。", "rubricZh": "", "distractorNotes": ["把家人關係弄混：sister 是兄弟姊妹關係", "把家人關係弄混：daughter 是父母與子女關係", "把家人關係弄混：aunt 是長輩親戚", ""]}, {"code": "L1-V03", "category": "vocabulary", "type": "single_choice", "stem": "Paul works in a hospital. He helps doctors and sick people. He is a ____.", "options": ["farmer", "cook", "nurse", "student"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "A nurse works in a hospital and helps doctors and sick people. In the lesson, Paul is a nurse. A farmer works on a farm, a cook cooks food, and a student studies at school.", "rubricEn": "", "difficulty": 1, "id": "L1-V03", "lesson": "L1", "explanationZh": "關鍵字是 hospital（醫院）和 helps doctors and sick people（幫醫生照顧病人），這就是 nurse 護理師；課文裡 Paul 也是 nurse。cook 是廚師，在廚房不在醫院。", "rubricZh": "", "distractorNotes": ["沒抓到 hospital 線索：farmer 在農場工作", "沒抓到 hospital 線索：cook 在廚房工作", "", "沒讀懂 works in a hospital：student 是學生不是職業"]}, {"code": "L1-V04", "category": "vocabulary", "type": "single_choice", "stem": "Nick's grandfather works on a farm. He grows rice and vegetables. He is a ____.", "options": ["farmer", "doctor", "nurse", "cook"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "A farmer works on a farm (farm + er) and grows rice and vegetables. Doctors and nurses work in hospitals. A cook cooks in a kitchen.", "rubricEn": "", "difficulty": 1, "id": "L1-V04", "lesson": "L1", "explanationZh": "關鍵字 farm（農場）＋ grows rice and vegetables（種稻米、蔬菜），在農場工作的人就是 farm 加 er：farmer。cook 也跟食物有關，但他是煮菜不是種菜。", "rubricZh": "", "distractorNotes": ["", "沒抓到 farm 線索：doctor 在醫院看病", "沒抓到 farm 線索：nurse 在醫院工作", "把 Nick 的祖母（cook）和祖父搞混"]}, {"code": "L1-V05", "category": "vocabulary", "type": "single_choice", "stem": "My uncle's daughter is my ____.", "options": ["aunt", "sister", "cousin", "wife"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Your uncle's daughter is your cousin. An aunt is older than you, a sister has the same parents as you, and a wife is a married woman.", "rubricEn": "", "difficulty": 2, "id": "L1-V05", "lesson": "L1", "explanationZh": "叔叔的女兒跟你同一輩，就是 cousin（堂表姊妹）。最容易選 sister，但 sister 是爸媽生的親姊妹，叔叔的女兒不是。", "rubricZh": "", "distractorNotes": ["搞錯輩分：aunt 是父母那一輩", "誤以為同輩女生都叫 sister；sister 必須是同一對父母所生", "", "把 daughter 和 wife 混淆"]}, {"code": "L1-V06", "category": "vocabulary", "type": "single_choice", "stem": "Scott teaches us basketball and running. He is our ____ teacher.", "options": ["English", "PE", "math", "Chinese"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "A PE teacher teaches sports like basketball and running. In the lesson, Scott is the new PE teacher. English, math, and Chinese teachers do not teach sports.", "rubricEn": "", "difficulty": 1, "id": "L1-V06", "lesson": "L1", "explanationZh": "教籃球、跑步的是體育老師 PE teacher，課文裡 Scott 就是新的體育老師。其他三個是英文、數學、國文老師，不教運動。", "rubricZh": "", "distractorNotes": ["沒注意 basketball and running 是運動", "", "沒注意 basketball and running 是運動", "沒注意 basketball and running 是運動"]}, {"code": "L1-V07", "category": "vocabulary", "type": "single_choice", "stem": "Students in Grades 7, 8, and 9 study at a ____.", "options": ["senior high school", "elementary school", "classroom", "junior high school"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Grades 7, 8, and 9 are at a junior high school. Elementary school is Grades 1 to 6. Senior high school is Grades 10 to 12. A classroom is a room, not a school.", "rubricEn": "", "difficulty": 1, "id": "L1-V07", "lesson": "L1", "explanationZh": "7、8、9 年級就是國中，英文是 junior high school（junior＝年紀小一點的）。最容易選錯 senior high school，那是高中（10–12 年級）。", "rubricZh": "", "distractorNotes": ["junior／senior 弄反：senior high school 是高中", "把國小和國中搞混", "把「學校」和「教室」搞混", ""]}, {"code": "L1-V08", "category": "vocabulary", "type": "single_choice", "stem": "Abby is our pet pig. She is small and ____. We all love her.", "options": ["cute", "farmer", "news", "again"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "\"Small and ____\" needs a describing word (adjective), and cute fits a pet we love. The lesson says: Abby is our pet pig. She's cute. Farmer and news are nouns. Again is not a describing word for a pet.", "rubricEn": "", "difficulty": 1, "id": "L1-V08", "lesson": "L1", "explanationZh": "small and ___：and 前面是形容詞 small，後面也要放形容詞，cute（可愛）最合理；課文也說 Abby... She's cute. farmer、news 是名詞，不能跟 small 並排。", "rubricZh": "", "distractorNotes": ["", "詞性錯：farmer 是名詞（農夫），不能和形容詞 small 並列", "詞性錯：news 是名詞（消息）", "詞性錯：again 是副詞，不能和 small 並列"]}, {"code": "L1-V09", "category": "vocabulary", "type": "single_choice", "stem": "Bella is very ____ with her students. They can't talk in class.", "options": ["young", "beautiful", "strict", "handsome"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "\"Be strict with + people\" means you have many rules for them. The students can't talk in class, so Bella is strict. Young, beautiful, and handsome do not go with \"with her students\" here.", "rubricEn": "", "difficulty": 2, "id": "L1-V09", "lesson": "L1", "explanationZh": "看後面那句：學生上課不能講話，表示老師很嚴格，strict。片語 be strict with＋人＝對某人嚴格。例：Mom is strict with me about bedtime.（媽媽對我睡覺時間很嚴格）", "rubricZh": "", "distractorNotes": ["沒注意 with her students 的搭配；young 不接 with", "沒注意 with her students 的搭配；beautiful 不接 with", "", "handsome 多形容男性外表，且不接 with＋人"]}, {"code": "L1-V10", "category": "vocabulary", "type": "single_choice", "stem": "A: I have good ____ for you.  B: What is it?", "options": ["problem", "news", "family", "class"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "\"I have good news for you\" is a common sentence. We don't say \"a news.\" Problem, family, and class need \"a\" (a problem), and \"good problem\" does not make sense.", "rubricEn": "", "difficulty": 2, "id": "L1-V10", "lesson": "L1", "explanationZh": "I have good news for you. 是「我有好消息要告訴你」。news 不能加 a。容易選 problem，但「好問題」要說 a good question，good problem 講不通。", "rubricZh": "", "distractorNotes": ["語意不通，且可數名詞單數前缺 a", "", "family 是可數名詞，單數要加 a，且語意不合", "class 是可數名詞，單數要加 a，且語意不合"]}, {"code": "L1-G01", "category": "grammar", "type": "single_choice", "stem": "Bella is ____ English teacher.", "options": ["a", "an", "are", "its"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "English starts with a vowel sound, so we use an: an English teacher. Use a before a consonant sound. Are is a be verb, and the sentence already has is. Its is for things, not people.", "rubricEn": "", "difficulty": 1, "id": "L1-G01", "lesson": "L1", "explanationZh": "English 開頭唸起來是母音（ㄧ的音），所以用 an：an English teacher。孩子常選 a，提醒他：看「發音」不是看字母，例如 an egg、a PE teacher。", "rubricZh": "", "distractorNotes": ["只看「單數名詞要加冠詞」，沒看 English 是母音開頭", "", "句中已有 be 動詞 is，不能再加 are", "所有格用錯：its 是「它的」"]}, {"code": "L1-G02", "category": "grammar", "type": "single_choice", "stem": "A: Is Scott your PE teacher?  B: Yes, ____.", "options": ["he is", "he's", "Scott is", "he isn't"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "A short \"Yes\" answer is Yes, + pronoun + be verb: Yes, he is. Don't use a short form (he's) at the end. Don't use the name (Scott) in a short answer. \"Yes\" can't go with \"isn't.\"", "rubricEn": "", "difficulty": 1, "id": "L1-G02", "lesson": "L1", "explanationZh": "Yes 的簡答＝Yes, 代名詞＋be 動詞，而且句尾不能縮寫：Yes, he is. 最常錯的是 he's：句尾的簡答不能縮寫成 he's。", "rubricZh": "", "distractorNotes": ["", "肯定簡答句尾不可縮寫成 he's", "簡答句主詞必須用代名詞，不可用人名", "Yes 開頭的簡答必須是肯定，不能接 isn't"]}, {"code": "L1-G03", "category": "grammar", "type": "single_choice", "stem": "A: Are you a nurse?  B: No, ____. I'm a doctor.", "options": ["I am", "you aren't", "I amn't", "I'm not"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "The question is \"Are you...?\", so answer with I. The short \"No\" answer is No, I'm not. \"I am\" is a \"Yes\" answer. \"You aren't\" has the wrong subject. \"Amn't\" is not a word.", "rubricEn": "", "difficulty": 1, "id": "L1-G03", "lesson": "L1", "explanationZh": "人家問 Are you…?（你是…嗎？），你要用「我」回答：No, I'm not. 最容易選 I amn't，但英文沒有 amn't 這個字，am 跟 not 不能縮在一起。", "rubricZh": "", "distractorNotes": ["No 開頭卻接肯定", "問 you 要用 I 回答，主詞沒換", "am 不可和 not 縮寫，沒有 amn't", ""]}, {"code": "L1-G04", "category": "grammar", "type": "single_choice", "stem": "Choose the correct sentence.", "options": ["Nick is a boy tall.", "Nick is tall boy.", "Nick is a tall boy.", "Nick is tall a boy."], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Put the adjective before the noun, and put a before them: a tall boy. A puts tall after boy. B has no a. D puts a in the wrong place.", "rubricEn": "", "difficulty": 1, "id": "L1-G04", "lesson": "L1", "explanationZh": "形容詞要放在名詞前面，a 放最前面：a tall boy（一個高的男孩）。中文順序也一樣「一個＋高的＋男孩」。B 少了 a，一個男孩前面要有 a。", "rubricZh": "", "distractorNotes": ["形容詞誤放在名詞後（中文語序干擾）", "單數可數名詞前漏了冠詞 a", "", "冠詞 a 應放在形容詞之前，不是之後"]}, {"code": "L1-G05", "category": "grammar", "type": "single_choice", "stem": "A: ____ is that young man?  B: He's our new PE teacher.", "options": ["Who", "Is", "Where", "How old"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "Use Who to ask about a person: Who is that young man? He's our new PE teacher. Is needs a Yes/No answer. Where asks about places. How old asks about age.", "rubricEn": "", "difficulty": 1, "id": "L1-G05", "lesson": "L1", "explanationZh": "回答是「他是我們新的體育老師」，在說他是誰，所以用 Who。容易選 Is，但 Is 開頭的問句要用 Yes/No 回答。", "rubricZh": "", "distractorNotes": ["", "Is 開頭是 Yes/No 問句，且 Is is 重複了 be 動詞", "Where 問地點，答案應是地方", "How old 問年紀，答案應是幾歲"]}, {"code": "L1-G06", "category": "grammar", "type": "single_choice", "stem": "Bella is ____ sister. She is my English teacher, too.", "options": ["I", "he", "you", "my"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Before a noun (sister), we need a possessive word like my. The next sentence also says my. I, he, and you can't go right before a noun.", "rubricEn": "", "difficulty": 1, "id": "L1-G06", "lesson": "L1", "explanationZh": "sister 前面要放「誰的」：my sister（我的姊姊），下一句也說 my。容易選 I，但 I 是「我」當主詞用，不能直接放在名詞前面。", "rubricZh": "", "distractorNotes": ["主格 I 不能修飾名詞，要用所有格 my", "主格 he 不能修飾名詞，所有格是 his", "主格 you 不能修飾名詞，所有格是 your", ""]}, {"code": "L1-G07", "category": "grammar", "type": "single_choice", "stem": "The Lins ____ a warm family.", "options": ["is", "am", "are", "be"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "The Lins means the whole Lin family (many people), so we use are. Is is for one person or thing. Am is only for I. Be is the base form and can't be used here.", "rubricEn": "", "difficulty": 2, "id": "L1-G07", "lesson": "L1", "explanationZh": "The Lins 是「林家人」，一家好幾個人，所以用 are。容易選 is，因為看起來像一個家庭，但 the＋姓氏-s 指全家人，要當複數。", "rubricZh": "", "distractorNotes": ["沒注意 The Lins 字尾 -s 是複數", "am 只能配 I", "", "be 動詞原形不能直接當直述句的動詞"]}, {"code": "L1-G08", "category": "grammar", "type": "single_choice", "stem": "Choose the INCORRECT sentence.", "options": ["I'm not a cook.", "I amn't a cook.", "He isn't a cook.", "They aren't cooks."], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "Find the wrong sentence. We can't put am and not together as \"amn't.\" Say I'm not. A, C, and D are all correct (I'm not, isn't, aren't).", "rubricEn": "", "difficulty": 2, "id": "L1-G08", "lesson": "L1", "explanationZh": "這題要找「錯」的句子。am 跟 not 不能縮寫，英文沒有 amn't，要說 I'm not，所以 B 是錯的。其他三句都對。", "rubricZh": "", "distractorNotes": ["誤以為 I'm not 錯；其實是 I am 縮寫後加 not，正確", "", "誤以為 isn't 錯；is 可以和 not 縮寫", "誤以為 aren't 錯；are 可以和 not 縮寫，複數 cooks 也正確"]}, {"code": "L1-G09", "category": "grammar", "type": "single_choice", "stem": "A: Is that ____ egg?  B: Yes, it is.", "options": ["an", "a", "it", "this"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "Egg starts with a vowel sound, so use an: an egg. Use a before consonant sounds. It can't go before a noun. That and this can't be used together.", "rubricEn": "", "difficulty": 1, "id": "L1-G09", "lesson": "L1", "explanationZh": "egg 開頭是母音的音，用 an：an egg。孩子可能選 a，提醒他 a 用在子音開頭的字，像 a pig、a cook。", "rubricZh": "", "distractorNotes": ["", "沒看 egg 是母音開頭", "代名詞 it 不能修飾名詞", "that 和 this 不可同時修飾同一個名詞"]}, {"code": "L1-G10", "category": "grammar", "type": "single_choice", "stem": "A: Who's Ann?  B: ____ (Ann and Nick are cousins.)", "options": ["Yes, she is.", "No, she isn't.", "She is a cousin Nick's.", "She's Nick's cousin."], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Don't answer a Who question with Yes or No. Use subject + be + possessive + noun: She's Nick's cousin. In C, Nick's must come before cousin.", "rubricEn": "", "difficulty": 2, "id": "L1-G10", "lesson": "L1", "explanationZh": "Who 問「誰」，不能用 Yes/No 回答；要說關係：She's Nick's cousin.（她是 Nick 的表姊）。容易選 C，但 Nick's（Nick 的）要放在 cousin 前面。", "rubricZh": "", "distractorNotes": ["Who 問句不能用 Yes 回答", "Who 問句不能用 No 回答", "所有格位置錯，應是 Nick's cousin", ""]}, {"code": "L1-R01", "category": "reading", "type": "single_choice", "stem": "According to the reading, what does Nick's mother do? Nick's mother is ____.", "options": ["a cook", "a nurse", "a doctor", "a farmer"], "correctIndex": 2, "answers": [], "passage": "The Lins\nHi, I'm Nick. I'm a junior high school student. I'm from a warm family. My grandfather is a farmer. My grandmother is a cook. They are nice. Paul is my father. He is a tall man. He is a nurse. Lily is my mother. She is a beautiful woman. She is a doctor. Bella is my sister. She is my English teacher, too. Eddie is my brother. He's a senior high school student. Abby is our pet pig. She's cute.", "explanationEn": "The reading says: Lily is my mother. ... She is a doctor. The cook is Nick's grandmother, the nurse is Paul, and the farmer is Nick's grandfather.", "rubricEn": "", "difficulty": 1, "id": "L1-R01", "lesson": "L1", "explanationZh": "短文說 Lily is my mother. ... She is a doctor. 所以媽媽是醫生。容易選 nurse：nurse 是爸爸 Paul，不是媽媽。", "rubricZh": "", "distractorNotes": ["把祖母的工作當成媽媽的", "把爸爸 Paul 的工作當成媽媽的（以為護理師一定是女性）", "", "把祖父的工作當成媽媽的"]}, {"code": "L1-R02", "category": "reading", "type": "single_choice", "stem": "According to the reading, who is a nurse in Nick's family?", "options": ["Paul", "Lily", "Bella", "Eddie"], "correctIndex": 0, "answers": [], "passage": "The Lins\nHi, I'm Nick. I'm a junior high school student. I'm from a warm family. My grandfather is a farmer. My grandmother is a cook. They are nice. Paul is my father. He is a tall man. He is a nurse. Lily is my mother. She is a beautiful woman. She is a doctor. Bella is my sister. She is my English teacher, too. Eddie is my brother. He's a senior high school student. Abby is our pet pig. She's cute.", "explanationEn": "The reading says: Paul is my father. ... He is a nurse. Lily is a doctor, Bella is an English teacher, and Eddie is a senior high school student.", "rubricEn": "", "difficulty": 2, "id": "L1-R02", "lesson": "L1", "explanationZh": "短文說 Paul is my father. ... He is a nurse. 所以護理師是爸爸 Paul。容易選 Lily，但 Lily 是醫生。", "rubricZh": "", "distractorNotes": ["", "以為護理師一定是女性，選了媽媽 Lily（她是醫生）", "Bella 是英文老師", "Eddie 是高中生"]}, {"code": "L1-R03", "category": "reading", "type": "single_choice", "stem": "According to the reading, which sentence is true?", "options": ["Eddie is a junior high school student.", "Bella is Nick's English teacher.", "Abby is Nick's cousin.", "Nick's grandmother is a farmer."], "correctIndex": 1, "answers": [], "passage": "The Lins\nHi, I'm Nick. I'm a junior high school student. I'm from a warm family. My grandfather is a farmer. My grandmother is a cook. They are nice. Paul is my father. He is a tall man. He is a nurse. Lily is my mother. She is a beautiful woman. She is a doctor. Bella is my sister. She is my English teacher, too. Eddie is my brother. He's a senior high school student. Abby is our pet pig. She's cute.", "explanationEn": "The reading says: Bella is my sister. She is my English teacher, too. So B is true. Eddie is a senior high school student. Abby is a pet pig. The grandmother is a cook; the grandfather is the farmer.", "rubricEn": "", "difficulty": 2, "id": "L1-R03", "lesson": "L1", "explanationZh": "短文說 Bella is my sister. She is my English teacher, too. 所以 B 對。容易選 A：Eddie 是 senior high school（高中）學生，不是國中。", "rubricZh": "", "distractorNotes": ["junior／senior 弄混：Eddie 是高中生，國中生是 Nick", "", "Abby 是寵物豬，不是堂表兄弟姊妹", "把祖父母的工作弄反：祖母是 cook"]}, {"code": "L1-R04", "category": "reading", "type": "single_choice", "stem": "According to the reading, who is Abby?", "options": ["Nick's sister", "Nick's teacher", "Nick's grandmother", "Nick's pet pig"], "correctIndex": 3, "answers": [], "passage": "The Lins\nHi, I'm Nick. I'm a junior high school student. I'm from a warm family. My grandfather is a farmer. My grandmother is a cook. They are nice. Paul is my father. He is a tall man. He is a nurse. Lily is my mother. She is a beautiful woman. She is a doctor. Bella is my sister. She is my English teacher, too. Eddie is my brother. He's a senior high school student. Abby is our pet pig. She's cute.", "explanationEn": "The reading says: Abby is our pet pig. She's cute. \"She\" does not always mean a person. Nick's sister is Bella, and the grandmother has no name in the reading.", "rubricEn": "", "difficulty": 1, "id": "L1-R04", "lesson": "L1", "explanationZh": "短文最後一句 Abby is our pet pig.（Abby 是我們的寵物豬）。孩子可能因為看到 She 以為是人，選了 sister；Nick 的姊姊其實是 Bella。", "rubricZh": "", "distractorNotes": ["看到 she 以為是女生家人；姊姊是 Bella", "姊姊 Bella 才是英文老師", "短文沒提祖母名字，看到 she 就猜是祖母", ""]}, {"code": "L1-R05", "category": "reading", "type": "single_choice", "stem": "According to the dialogue, Nick is Ann's ____.", "options": ["cousin", "brother", "teacher", "father"], "correctIndex": 0, "answers": [], "passage": "(In the classroom)\nRita: Ann, we're in the same class again!\nAnn: Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.\nRita: Nice to meet you, Nick. I'm Rita.\nNick: Nice to meet you, too, Rita.\nAnn: Hey, Rita. Good news. Bella is our English teacher!\nNick: Oh, no. That's not good.\nAnn: What's the problem? She's a great teacher.\nNick: Well... she's a strict teacher, too.\nBella: Nick!", "explanationEn": "Ann says: This is Nick. He's my cousin. So Nick is Ann's cousin. The dialogue does not say he is her brother, teacher, or father.", "rubricEn": "", "difficulty": 1, "id": "L1-R05", "lesson": "L1", "explanationZh": "Ann 介紹時說 This is Nick. He's my cousin. 所以 Nick 是 Ann 的表兄弟 cousin。容易選 brother，但對話裡沒有說他們是兄妹。", "rubricZh": "", "distractorNotes": ["", "把 cousin 誤解為親兄弟", "對話裡的老師是 Bella，不是 Nick", "沒讀懂 cousin 的意思，亂猜家人關係"]}, {"code": "L1-R06", "category": "reading", "type": "single_choice", "stem": "According to the dialogue, Ann says Bella is their English teacher, and Nick says, \"That's not good.\" Why?", "options": ["Rita is a new student.", "Nick is in Class 701.", "Bella is not their English teacher.", "Bella is a strict teacher."], "correctIndex": 3, "answers": [], "passage": "(In the classroom)\nRita: Ann, we're in the same class again!\nAnn: Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.\nRita: Nice to meet you, Nick. I'm Rita.\nNick: Nice to meet you, too, Rita.\nAnn: Hey, Rita. Good news. Bella is our English teacher!\nNick: Oh, no. That's not good.\nAnn: What's the problem? She's a great teacher.\nNick: Well... she's a strict teacher, too.\nBella: Nick!", "explanationEn": "Ann asks, \"What's the problem?\" Nick says, \"Well... she's a strict teacher, too.\" So Bella is strict. The dialogue does not say Rita is new. Class 701 is not the problem. C is wrong because Bella IS their English teacher.", "rubricEn": "", "difficulty": 2, "id": "L1-R06", "lesson": "L1", "explanationZh": "Ann 問 What's the problem? Nick 回答 she's a strict teacher, too.（她也是很嚴格的老師），所以他覺得不好。容易選 C，但 Ann 明明說 Bella 就是他們的英文老師。", "rubricZh": "", "distractorNotes": ["對話沒說 Rita 是新生，而且與 Nick 的反應無關", "701 班是介紹 Nick 時的資訊，不是他說不好的原因", "與對話相反：Ann 說 Bella 就是她們的英文老師", ""]}, {"code": "L1-C01", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Use a question word + is (a short form is OK). Ann wants to know about the young man.", "options": [], "correctIndex": null, "answers": ["who's", "who’s", "who is"], "passage": "(At school)\nAnn: Good morning, Nick.\nNick: Good morning, Ann.\nAnn: Nick, ____ that young man? He's tall and handsome.\nNick: He's our new PE teacher.\nAnn: Really?\nNick: Yes, he's Bella's friend, and his name is Scott.", "explanationEn": "To ask about a person, use Who + be + subject. Who is = Who's.", "rubricEn": "", "difficulty": 1, "id": "L1-C01", "lesson": "L1", "explanationZh": "問「那個人是誰」用 Who is，縮寫成 Who's：Who's that young man? 寫 Who is 也算對。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C02", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: good-looking (for a man); h_______.", "options": [], "correctIndex": null, "answers": ["handsome"], "passage": "(At school)\nAnn: Good morning, Nick.\nNick: Good morning, Ann.\nAnn: Nick, who's that young man? He's tall and ____.\nNick: He's our new PE teacher.\nAnn: Really?\nNick: Yes, he's Bella's friend, and his name is Scott.", "explanationEn": "Handsome means good-looking (for a man). Tall and handsome are two describing words joined by and. The d is silent.", "rubricEn": "", "difficulty": 1, "id": "L1-C02", "lesson": "L1", "explanationZh": "handsome＝英俊的，用來誇男生帥；tall and handsome＝又高又帥。提醒拼字：中間的 d 不發音但要寫。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C03", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: the school class for sports and exercise (two capital letters).", "options": [], "correctIndex": null, "answers": ["PE", "P.E.", "pe", "p.e."], "passage": "(At school)\nAnn: Good morning, Nick.\nNick: Good morning, Ann.\nAnn: Nick, who's that young man? He's tall and handsome.\nNick: He's our new ____ teacher.\nAnn: Really?\nNick: Yes, he's Bella's friend, and his name is Scott.", "explanationEn": "PE (or P.E.) is short for physical education. A PE teacher teaches sports.", "rubricEn": "", "difficulty": 1, "id": "L1-C03", "lesson": "L1", "explanationZh": "PE（也可寫 P.E.）是體育課，PE teacher＝體育老師。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C04", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank with the possessive word for \"he\".", "options": [], "correctIndex": null, "answers": ["his"], "passage": "(At school)\nAnn: Good morning, Nick.\nNick: Good morning, Ann.\nAnn: Nick, who's that young man? He's tall and handsome.\nNick: He's our new PE teacher.\nAnn: Really?\nNick: Yes, he's Bella's friend, and ____ name is Scott.", "explanationEn": "Before name we need a possessive word. The young man is a he, so use his: his name is Scott.", "rubricEn": "", "difficulty": 1, "id": "L1-C04", "lesson": "L1", "explanationZh": "name 前面要說「誰的名字」，那個男人是「他」，所以用 his（他的）：his name is Scott。容易寫成 he，但 he 是「他」不是「他的」。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C05", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: not different; s___.", "options": [], "correctIndex": null, "answers": ["same"], "passage": "(In the classroom)\nRita: Ann, we're in the ____ class again!\nAnn: Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.\nRita: Nice to meet you, Nick. I'm Rita.\nNick: Nice to meet you, too, Rita.\nAnn: Hey, Rita. Good news. Bella is our English teacher!\nNick: Oh, no. That's not good.\nAnn: What's the problem? She's a great teacher.\nNick: Well... she's a strict teacher, too.\nBella: Nick!", "explanationEn": "The same + noun means not different. \"In the same class\" means Ann and Rita are in one class together.", "rubricEn": "", "difficulty": 1, "id": "L1-C05", "lesson": "L1", "explanationZh": "the same class＝同一班。same 意思是「相同的」，前面要有 the。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C06", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: also; t__.", "options": [], "correctIndex": null, "answers": ["too"], "passage": "(In the classroom)\nRita: Ann, we're in the same class again!\nAnn: Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.\nRita: Nice to meet you, Nick. I'm Rita.\nNick: Nice to meet you, ____, Rita.\nAnn: Hey, Rita. Good news. Bella is our English teacher!\nNick: Oh, no. That's not good.\nAnn: What's the problem? She's a great teacher.\nNick: Well... she's a strict teacher, too.\nBella: Nick!", "explanationEn": "When someone says Nice to meet you, you say Nice to meet you, too. Too means also.", "rubricEn": "", "difficulty": 1, "id": "L1-C06", "lesson": "L1", "explanationZh": "別人說 Nice to meet you.，你回 Nice to meet you, too.（我也很高興認識你），too＝也。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C07", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: new information you hear or read; n___.", "options": [], "correctIndex": null, "answers": ["news"], "passage": "(In the classroom)\nRita: Ann, we're in the same class again!\nAnn: Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.\nRita: Nice to meet you, Nick. I'm Rita.\nNick: Nice to meet you, too, Rita.\nAnn: Hey, Rita. Good ____. Bella is our English teacher!\nNick: Oh, no. That's not good.\nAnn: What's the problem? She's a great teacher.\nNick: Well... she's a strict teacher, too.\nBella: Nick!", "explanationEn": "Good news means something good you hear. News looks plural but it is not. Don't write \"new.\"", "rubricEn": "", "difficulty": 1, "id": "L1-C07", "lesson": "L1", "explanationZh": "Good news.＝好消息。news 字尾雖然有 s，但不是複數；不要寫成 new（新的）。", "rubricZh": "", "distractorNotes": []}, {"code": "L1-C08", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank with one small word. Hint: f___.", "options": [], "correctIndex": null, "answers": ["from"], "passage": "The Lins\nHi, I'm Nick. I'm a junior high school student. I'm ____ a warm family. My grandfather is a farmer. My grandmother is a cook. They are nice. Paul is my father. He is a tall man. He is a nurse. Lily is my mother. She is a beautiful woman. She is a doctor. Bella is my sister. She is my English teacher, too. Eddie is my brother. He's a senior high school student. Abby is our pet pig. She's cute.", "explanationEn": "Be + from tells where someone comes from: I'm from a warm family.", "rubricEn": "", "difficulty": 1, "id": "L1-C08", "lesson": "L1", "explanationZh": "I'm from…＝我來自…；I'm from a warm family.＝我來自一個溫暖的家庭。例：I'm from Taiwan.", "rubricZh": "", "distractorNotes": []}, {"code": "L1-W01", "category": "sentence", "type": "sentence_writing", "stem": "Write one sentence about the job of a family member (dad, mom, uncle, aunt...). Use: My ... is a / an + job.", "options": [], "correctIndex": null, "answers": ["My father is a farmer.", "My aunt is an English teacher.", "My uncle is a cook."], "passage": null, "explanationEn": "Pattern: subject + be + a/an + job. Use an before a vowel sound: an English teacher.", "rubricEn": "Check: 1) a family word (father, mother, uncle, aunt...); 2) is for one person; 3) a or an before the job (an before a vowel sound); 4) capital letter at the start and a period at the end.", "difficulty": 1, "id": "L1-W01", "lesson": "L1", "explanationZh": "句型：My＋家人＋is＋a/an＋職業。例：My father is a farmer. 職業開頭是母音的音就用 an，例如 an English teacher。", "rubricZh": "家長檢查：1. 有沒有寫出家人（father、mother、uncle、aunt…）；2. 一個人用 is；3. 職業前有 a 或 an（English teacher 要用 an）；4. 開頭大寫、結尾句點。", "distractorNotes": []}, {"code": "L1-W02", "category": "sentence", "type": "sentence_writing", "stem": "Write two sentences about Scott. Sentence 1: use not to say he is not an English teacher. Sentence 2: say what teacher he is (he teaches PE).", "options": [], "correctIndex": null, "answers": ["Scott is not an English teacher. He is a PE teacher.", "Scott isn't an English teacher. He's a PE teacher."], "passage": null, "explanationEn": "Pattern: subject + be + not + a/an + noun. PE starts with a consonant sound (/p/), so use a PE teacher.", "rubricEn": "Check: 1) is not or isn't in sentence 1; 2) an English teacher, a PE teacher; 3) He in sentence 2; 4) a be verb in both sentences.", "difficulty": 2, "id": "L1-W02", "lesson": "L1", "explanationZh": "第一句「不是」：Scott is not（isn't）an English teacher. 第二句換成 He：He is a PE teacher. 注意 an English、a PE。", "rubricZh": "家長檢查：1. 第一句有 is not 或 isn't；2. an English teacher、a PE teacher 冠詞對；3. 第二句用 He 開頭；4. 兩句都有 is。", "distractorNotes": []}, {"code": "L1-W03", "category": "sentence", "type": "sentence_writing", "stem": "Write a question with Is ... a(n) ...? Ask about the job of someone's family member (for example: Is your sister a doctor?). Then write a short \"No\" answer.", "options": [], "correctIndex": null, "answers": ["A: Is your sister a doctor? B: No, she isn't.", "A: Is your father a nurse? B: No, he isn't.", "A: Is your uncle a farmer? B: No, he's not."], "passage": null, "explanationEn": "Yes/No question: Be verb + subject + a/an + noun? Short \"No\" answer: No, + pronoun + be + not.", "rubricEn": "Check: 1) Is at the start and a question mark at the end; 2) your before the family word; 3) a or an before the job; 4) he or she in the answer; 5) No, ... isn't (or 's not).", "difficulty": 2, "id": "L1-W03", "lesson": "L1", "explanationZh": "問句 Is 放最前面：Is your sister a doctor? 不是的話回答 No, she isn't.（男生用 he）", "rubricZh": "家長檢查：1. Is 放句首、句尾問號；2. your 放在家人前面；3. 職業前有 a/an；4. 回答用 he 或 she，不是名字；5. No 後面接 isn't（或 's not）。", "distractorNotes": []}, {"code": "L1-W04", "category": "sentence", "type": "sentence_writing", "stem": "Use Who's to ask about that girl. Then answer with my + a family word (for example, my cousin).", "options": [], "correctIndex": null, "answers": ["A: Who's that girl? B: She's my cousin.", "A: Who's that girl? B: She is my sister."], "passage": null, "explanationEn": "Who + be + subject? asks who someone is. Answer: subject + be + possessive + family word.", "rubricEn": "Check: 1) Who's (or Who is) that girl? with a question mark; 2) no Yes or No in the answer; 3) She + be + my (or another possessive) + a family word (cousin, sister...).", "difficulty": 2, "id": "L1-W04", "lesson": "L1", "explanationZh": "問：Who's that girl?（那個女生是誰？）答：She's my cousin.（她是我的表妹）。Who 的問題不能回答 Yes/No。", "rubricZh": "家長檢查：1. 問句是 Who's（Who is）that girl? 有問號；2. 回答沒有用 Yes/No；3. 回答是 She＋is＋my＋家人稱謂（cousin、sister…）。", "distractorNotes": []}, {"code": "L1-W05", "category": "sentence", "type": "sentence_writing", "stem": "Choose two words from tall, handsome, beautiful, cute, young. Write one sentence about a person or a pet. Use and. (Subject + be + word and word)", "options": [], "correctIndex": null, "answers": ["My brother is tall and handsome.", "My mother is young and beautiful.", "Our pet cat is young and cute."], "passage": null, "explanationEn": "Pattern: subject + be + adjective and adjective. Like the lesson: He's tall and handsome.", "rubricEn": "Check: 1) two words from the list, joined by and; 2) the right be verb for the subject; 3) no a or an before the adjectives; 4) handsome is for boys and men, beautiful is for girls, women, or things.", "difficulty": 1, "id": "L1-W05", "lesson": "L1", "explanationZh": "句型：主詞＋is/are＋形容詞 and 形容詞。例：My brother is tall and handsome. 形容詞前面不用加 a。", "rubricZh": "家長檢查：1. 用了清單裡兩個形容詞、中間有 and；2. is/are 跟主詞配對；3. 形容詞前沒有加 a；4. handsome 形容男生、beautiful 形容女生或東西。", "distractorNotes": []}, {"code": "L2-V01", "category": "vocabulary", "type": "single_choice", "stem": "A ____ has black and white lines all over its body. It is in the horse family.", "options": ["lion", "bear", "zebra", "rabbit"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "A zebra has black and white lines and is in the horse family. Lions, bears, and rabbits don't have black and white lines.", "rubricEn": "", "difficulty": 1, "id": "L2-V01", "lesson": "L2", "explanationZh": "關鍵是「全身黑白條紋、馬的親戚」，就是 zebra 斑馬。其他三個（獅子、熊、兔子）都沒有黑白條紋。", "rubricZh": "", "distractorNotes": ["以為獅子有條紋（有條紋的是老虎，而且是黃黑色）", "熊不是黑白條紋、也不是馬科", "", "兔子不是馬科、沒有條紋"]}, {"code": "L2-V02", "category": "vocabulary", "type": "single_choice", "stem": "My birth year is 2000, so my Chinese zodiac animal ____ is the dragon.", "options": ["size", "sign", "picture", "meter"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "Your Chinese zodiac animal sign comes from your birth year. Size, picture, and meter have nothing to do with birth years.", "rubricEn": "", "difficulty": 1, "id": "L2-V02", "lesson": "L2", "explanationZh": "animal sign＝生肖，Chinese zodiac animal sign＝十二生肖。容易選 size，但 size 是尺寸，跟生肖無關。", "rubricZh": "", "distractorNotes": ["把 size（尺寸）和 sign 混淆", "", "picture 是照片／圖畫，不是生肖", "meter 是長度單位公尺"]}, {"code": "L2-V03", "category": "vocabulary", "type": "single_choice", "stem": "Kiki is a ____. Its favorite food is the banana, and it likes to climb trees.", "options": ["rooster", "snake", "goat", "monkey"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "A monkey likes bananas and climbs trees. Roosters, snakes, and goats don't eat bananas or climb trees.", "rubricEn": "", "difficulty": 1, "id": "L2-V03", "lesson": "L2", "explanationZh": "愛吃香蕉、會爬樹，是 monkey 猴子。可以問孩子：公雞、蛇、山羊會爬樹吃香蕉嗎？", "rubricZh": "", "distractorNotes": ["公雞吃穀物，不爬樹", "蛇不吃香蕉", "山羊吃草，不爬樹", ""]}, {"code": "L2-V04", "category": "vocabulary", "type": "single_choice", "stem": "Vivian is full of energy. She runs, swims, and dances every day. She is very ____.", "options": ["slow", "lazy", "energetic", "sleepy"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Full of energy and active every day = energetic. Slow, lazy, and sleepy mean the opposite.", "rubricEn": "", "difficulty": 1, "id": "L2-V04", "lesson": "L2", "explanationZh": "full of energy（充滿精力），每天跑步游泳跳舞，就是 energetic 有活力的。slow、lazy、sleepy 都是相反的意思。", "rubricZh": "", "distractorNotes": ["只看到 runs 就選速度，忽略 full of energy", "意思相反（懶惰）", "", "意思相反（想睡）"]}, {"code": "L2-V05", "category": "vocabulary", "type": "single_choice", "stem": "A: How tall is that giraffe?\nB: It's about 4.8 ____ tall.", "options": ["meters", "years", "sizes", "signs"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "Number + meters + tall tells how tall something is. Years are for age or lifespan. Sizes and signs don't go with tall.", "rubricEn": "", "difficulty": 1, "id": "L2-V05", "lesson": "L2", "explanationZh": "「幾公尺高」說 數字＋meters tall，例如 It's about 4.8 meters tall. 容易選 years，但 years 是講年紀或活幾年，不是身高。", "rubricZh": "", "distractorNotes": ["", "把壽命的 years 和身高單位混淆", "size 是尺寸，不是長度單位", "sign 是符號，與身高無關"]}, {"code": "L2-V06", "category": "vocabulary", "type": "single_choice", "stem": "Asian elephants live about 60 years. Their ____ is about 60 years.", "options": ["size", "lifespan", "sign", "picture"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "How long an animal lives is its lifespan. Size, sign, and picture can't mean \"lives 60 years.\"", "rubricEn": "", "difficulty": 1, "id": "L2-V06", "lesson": "L2", "explanationZh": "活多久＝lifespan 壽命。課文說亞洲象壽命約 60 年。容易選 size，但 size 是大小。", "rubricZh": "", "distractorNotes": ["把體型（size）和壽命混淆", "", "sign 是符號／生肖", "picture 是照片／圖畫"]}, {"code": "L2-V07", "category": "vocabulary", "type": "single_choice", "stem": "Lisa is friendly and nice to everyone, and everybody likes her. She is a ____.", "options": ["people person", "birth year", "movie theater", "animal sign"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "A people person is friendly, and everybody likes them. Birth year, movie theater, and animal sign don't describe a person.", "rubricEn": "", "difficulty": 2, "id": "L2-V07", "lesson": "L2", "explanationZh": "people person＝人緣很好、喜歡跟人相處的人。其他三個是出生年、電影院、生肖，都不是在形容人。", "rubricZh": "", "distractorNotes": ["", "birth year 是出生年，不是人", "movie theater 是地點", "animal sign 是生肖"]}, {"code": "L2-V08", "category": "vocabulary", "type": "single_choice", "stem": "A: It's Helen's birthday today.\nB: ____ she is so happy.", "options": ["What about", "No wonder", "Only", "But"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "No wonder + sentence = \"That's why...\" It's her birthday, so no wonder she is happy. What about needs a noun after it. Only and But don't fit here.", "rubricEn": "", "difficulty": 2, "id": "L2-V08", "lesson": "L2", "explanationZh": "No wonder＝難怪。今天是她生日，難怪她這麼開心。容易選 What about，但那是「…呢？」用來問問題，後面接名詞。", "rubricZh": "", "distractorNotes": ["What about 要接名詞並構成問句", "", "only 是「只」，語意不通", "but 表轉折，這裡沒有相反意思"]}, {"code": "L2-V09", "category": "vocabulary", "type": "single_choice", "stem": "Let's go to the ____ and watch a new movie tonight.", "options": ["farm", "zoo", "movie theater", "river"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "You watch movies at a movie theater. A farm, a zoo, and a river are not places for movies.", "rubricEn": "", "difficulty": 1, "id": "L2-V09", "lesson": "L2", "explanationZh": "看電影要去 movie theater 電影院。zoo 是動物園，可以看動物但不能看電影。", "rubricZh": "", "distractorNotes": ["農場不是看電影的地方", "動物園不是看電影的地方", "", "河不是看電影的地方"]}, {"code": "L2-V10", "category": "vocabulary", "type": "single_choice", "stem": "This T-shirt is too small for me. Do you have it in a bigger ____?", "options": ["lifespan", "meter", "sign", "size"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "The T-shirt is too small, so you ask for a bigger size. Lifespan, meter, and sign are wrong here.", "rubricEn": "", "difficulty": 2, "id": "L2-V10", "lesson": "L2", "explanationZh": "衣服太小，要問有沒有大一點的「尺寸」size。生活例句：Do you have this in a smaller size?（有小一號的嗎？）", "rubricZh": "", "distractorNotes": ["lifespan 是壽命", "meter 是長度單位，不是衣服尺寸", "sign 是符號", ""]}, {"code": "L2-G01", "category": "grammar", "type": "single_choice", "stem": "A: What are these?\nB: ____", "options": ["It's a pencil.", "Yes, they are.", "These are pencil.", "They're Kate's books."], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "\"What are these?\" asks about more than one thing, so answer with They're + plural noun. \"It's a pencil\" is for one thing. Don't answer a What question with Yes. \"These are pencil\" needs pencils.", "rubricEn": "", "difficulty": 1, "id": "L2-G01", "lesson": "L2", "explanationZh": "What are these? 問「這些（很多個）是什麼」，要用 They're＋複數名詞回答。容易選 It's a pencil，但那是一個東西，不是很多個。", "rubricZh": "", "distractorNotes": ["單複數不一致（these 要用 they 回答）", "What 開頭的問句不能用 Yes/No 回答", "pencil 少了 -s，且回答不用 these", ""]}, {"code": "L2-G02", "category": "grammar", "type": "single_choice", "stem": "A: Is that a table?\nB: Yes, ____.", "options": ["that is", "it's", "this is", "it is"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "For \"Is that...?\" answer with it: Yes, it is. Don't use it's at the end of a short answer. Don't use that is or this is.", "rubricEn": "", "difficulty": 1, "id": "L2-G02", "lesson": "L2", "explanationZh": "問 Is that…?，回答一律用 it：Yes, it is. 容易選 it's，但句尾的簡答不能縮寫。", "rubricZh": "", "distractorNotes": ["簡答不可用 that，要改用 it", "肯定簡答時 it is 不可縮寫", "簡答不可用 this，而且與 that 不一致", ""]}, {"code": "L2-G03", "category": "grammar", "type": "single_choice", "stem": "There are three ____ under the table.", "options": ["mouse", "mouses", "mice", "mices"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "The plural of mouse is mice. Three needs a plural. Mouses and mices are not words.", "rubricEn": "", "difficulty": 1, "id": "L2-G03", "lesson": "L2", "explanationZh": "mouse（老鼠）的複數很特別，是 mice。容易寫 mouses，但這是錯的拼法。", "rubricZh": "", "distractorNotes": ["忘了 three 後面要用複數", "把不規則名詞當規則變化加 -s", "", "已經是複數 mice 又再加 -s"]}, {"code": "L2-G04", "category": "grammar", "type": "single_choice", "stem": "We have twenty ____ on the farm.", "options": ["sheeps", "a sheep", "sheepes", "sheep"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Sheep is the same for one and many: twenty sheep. Sheeps and sheepes are not words. \"A sheep\" is only one.", "rubricEn": "", "difficulty": 1, "id": "L2-G04", "lesson": "L2", "explanationZh": "sheep（羊）一隻、很多隻都寫 sheep，不加 s。所以 twenty sheep。孩子最容易寫 sheeps。", "rubricZh": "", "distractorNotes": ["把單複數同形的字當規則變化加 -s", "a 只用在單數，與 twenty 衝突", "誤套 -es 規則", ""]}, {"code": "L2-G05", "category": "grammar", "type": "single_choice", "stem": "A: ____ those your rulers?\nB: No, they aren't.", "options": ["Is", "Do", "Are", "Am"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Those is plural, so use Are: Are those your rulers? The answer \"they aren't\" also uses are. Is is for one thing. Am is only for I. Do doesn't fit because there is no action verb.", "rubricEn": "", "difficulty": 1, "id": "L2-G05", "lesson": "L2", "explanationZh": "those（那些）是複數，要用 Are：Are those your rulers? 後面回答 they aren't 也是 are。容易選 Is，但 Is 是給一個東西用的。", "rubricZh": "", "distractorNotes": ["those 是複數，不能用 is", "句中沒有一般動詞，不能用 do", "", "am 只能搭配 I"]}, {"code": "L2-G06", "category": "grammar", "type": "single_choice", "stem": "A: What's this?\nB: ____ an eraser.", "options": ["This's", "They're", "These are", "It's"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Answer \"What's this?\" with It's: It's an eraser. \"This's\" is not used. An eraser is one thing, so They're and These are are wrong.", "rubricEn": "", "difficulty": 1, "id": "L2-G06", "lesson": "L2", "explanationZh": "回答 What's this? 要用 It's：It's an eraser. 容易選 This's，但英文不會把 this is 縮成 this's。", "rubricZh": "", "distractorNotes": ["this 不可和 be 動詞縮寫", "單數名詞 an eraser 不能用 they", "單數名詞不能用 these are", ""]}, {"code": "L2-G07", "category": "grammar", "type": "single_choice", "stem": "A: Is this your bag, Amy?\nB: Yes, it's ____ bag.", "options": ["my", "your", "her", "its"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "Amy is talking about her own bag, so she says my bag. Your is for the other person. Her is how other people talk about Amy. Its is for things.", "rubricEn": "", "difficulty": 1, "id": "L2-G07", "lesson": "L2", "explanationZh": "Amy 自己回答「是我的包包」，要說 my bag。容易選 her，但 Amy 講自己要說 my，別人講 Amy 才說 her。", "rubricZh": "", "distractorNotes": ["", "沒有換人稱：別人問 your，自己答要改成 my", "Amy 說自己要用第一人稱", "its 指動物或東西，不是人"]}, {"code": "L2-G08", "category": "grammar", "type": "single_choice", "stem": "The ____ toys are on the floor. (The toys belong to the children.)", "options": ["childrens'", "children", "children's", "childrens"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Children does not end in s, so add 's: children's toys. Childrens and childrens' are not words. Children without 's doesn't show \"belong to.\"", "rubricEn": "", "difficulty": 2, "id": "L2-G08", "lesson": "L2", "explanationZh": "children（小孩們）字尾沒有 s，所有格直接加 's：children's toys（小孩們的玩具）。容易選 childrens'，但 childrens 本身就是錯字。", "rubricZh": "", "distractorNotes": ["以為 children 還要加 s 再加撇號", "少了所有格 's", "", "children 已是複數，不能再加 s"]}, {"code": "L2-G09", "category": "grammar", "type": "single_choice", "stem": "These are my ____.", "options": ["watches", "box", "watch", "a watch"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "These are needs a plural noun: watches (watch + es). Box and watch are singular. Don't use a after my.", "rubricEn": "", "difficulty": 2, "id": "L2-G09", "lesson": "L2", "explanationZh": "These are 後面要接很多個：watches（watch 字尾 ch 加 es）。容易選 watch，但那只有一個。", "rubricZh": "", "distractorNotes": ["", "box 是單數，與 These are 不一致", "watch 是單數，少了 -es", "my 和 a 不能連用，且為單數"]}, {"code": "L2-G10", "category": "grammar", "type": "single_choice", "stem": "Gary and Mary are brother and sister. That woman is ____ mother.", "options": ["Gary and Mary", "Gary and Mary's", "Gary's and Mary", "Gary's and Mary's"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "Gary and Mary have one mother together, so put 's only on the last name: Gary and Mary's mother. \"Gary's and Mary's\" means two different mothers.", "rubricEn": "", "difficulty": 3, "id": "L2-G10", "lesson": "L2", "explanationZh": "Gary 和 Mary 是兄妹，共用同一個媽媽，所以 's 只加在最後：Gary and Mary's mother。容易選 Gary's and Mary's，那會變成兩人各有一個媽媽。", "rubricZh": "", "distractorNotes": ["完全沒有所有格", "", "所有格加錯位置（共同所有應加在最後一個名字）", "這是「分別所有」，表示兩人各有不同的媽媽"]}, {"code": "L2-R01", "category": "reading", "type": "single_choice", "stem": "Where are Bella and Scott?", "options": ["In a zoo.", "In a movie theater.", "On a farm.", "At school."], "correctIndex": 1, "answers": [], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "The dialogue starts with (In a movie theater). The other places are not in the dialogue.", "rubricEn": "", "difficulty": 1, "id": "L2-R01", "lesson": "L2", "explanationZh": "對話一開始就寫 (In a movie theater)，他們在電影院。其他地方對話都沒提到。", "rubricZh": "", "distractorNotes": ["看到很多動物名稱就以為在動物園", "", "看到 ox、goat 等農場動物而誤判", "對話沒提到學校"]}, {"code": "L2-R02", "category": "reading", "type": "single_choice", "stem": "What is Scott's animal sign?", "options": ["The rabbit.", "The pig.", "The dragon.", "The rooster."], "correctIndex": 2, "answers": [], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "Bella says Scott's birth year is 2000 and \"You're a dragon.\" The rabbit is Bella's sign. Abby is a pig, but her sign is the dragon. The rooster is not anyone's sign here.", "rubricEn": "", "difficulty": 1, "id": "L2-R02", "lesson": "L2", "explanationZh": "Bella 說 Scott 出生在 2000 年，You're a dragon，所以屬龍。容易選 pig，但豬是 Abby 本身，不是 Scott 的生肖。", "rubricZh": "", "distractorNotes": ["把 Bella 的生肖當成 Scott 的", "把 Abby the pig 的「豬」當成生肖", "", "對話沒有說誰屬雞"]}, {"code": "L2-R03", "category": "reading", "type": "single_choice", "stem": "Which is TRUE about the dialogue?", "options": ["Bella's birth year is 2000.", "The dolls are the Chinese zodiac animal signs.", "Abby is a pig, and her animal sign is the dragon.", "Bella is a dragon."], "correctIndex": 2, "answers": [], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "Abby the pig's birth year is 2024, and \"She's a dragon, too.\" So C is true. A: 2000 is Scott's year; Bella's is 1999. B: Bella says \"No, they aren't.\" D: Bella is a rabbit.", "rubricEn": "", "difficulty": 2, "id": "L2-R03", "lesson": "L2", "explanationZh": "Abby 這隻小豬出生在 2024 年，She's a dragon, too.，所以 C 對。容易選 B，但 Bella 說 No, they aren't. 那些娃娃不是生肖。", "rubricZh": "", "distractorNotes": ["把 Scott 的出生年張冠李戴", "忽略 Bella 的否定回答 No, they aren't", "", "Bella 屬兔，屬龍的是 Scott 和 Abby"]}, {"code": "L2-R04", "category": "reading", "type": "single_choice", "stem": "Why does Scott say \"No wonder you are a people person\" to Bella?", "options": ["Because Bella is a rabbit, and a rabbit is nice and warm.", "Because Bella is a dragon, and a dragon is smart.", "Because Bella likes the dolls.", "Because Bella's birth year is 2024."], "correctIndex": 0, "answers": [], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "Bella says she is a rabbit and \"A rabbit is nice and warm.\" So Scott says she is a people person. B is about Scott's sign. C and D are not the reason; 2024 is Abby's birth year.", "rubricEn": "", "difficulty": 2, "id": "L2-R04", "lesson": "L2", "explanationZh": "Bella 說自己屬兔，A rabbit is nice and warm（兔子和善又溫暖），所以 Scott 說難怪你人緣好。容易選 B，但龍是 Scott 的生肖。", "rubricZh": "", "distractorNotes": ["", "把 Scott（屬龍）的特質套到 Bella", "抓到對話中其他句子但與 no wonder 的因果無關", "2024 是 Abby 的出生年"]}, {"code": "L2-R05", "category": "reading", "type": "single_choice", "stem": "How tall is an Asian elephant?", "options": ["About 3.2 meters tall.", "About 60 meters tall.", "About 70 meters tall.", "About 2.75 meters tall."], "correctIndex": 3, "answers": [], "passage": "Asian Elephants vs. African Elephants\nAre they Asian elephants or African elephants?\n● Size\nAfrican elephants are different from Asian elephants. African elephants are very big, and their ears are big, too. Asian elephants are small, and their ears are short. An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall.\n● Lifespan\nAsian elephants' lifespans are about 60 years, but African elephants' lifespans are about 70 years.", "explanationEn": "The reading says an Asian elephant is only about 2.75 meters tall. 3.2 meters is an African elephant. 60 and 70 are years (lifespans), not height.", "rubricEn": "", "difficulty": 1, "id": "L2-R05", "lesson": "L2", "explanationZh": "文章說 an Asian elephant is only about 2.75 meters tall。容易選 3.2，但那是非洲象；60、70 是活幾年，不是身高。", "rubricZh": "", "distractorNotes": ["把非洲象的身高當成亞洲象", "把壽命 60 年誤當身高", "把非洲象壽命 70 年誤當身高", ""]}, {"code": "L2-R06", "category": "reading", "type": "single_choice", "stem": "Which is TRUE about the elephants?", "options": ["Asian elephants' ears are big.", "African elephants' lifespans are about 70 years.", "Asian elephants are very big.", "African elephants and Asian elephants are the same."], "correctIndex": 1, "answers": [], "passage": "Asian Elephants vs. African Elephants\nAre they Asian elephants or African elephants?\n● Size\nAfrican elephants are different from Asian elephants. African elephants are very big, and their ears are big, too. Asian elephants are small, and their ears are short. An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall.\n● Lifespan\nAsian elephants' lifespans are about 60 years, but African elephants' lifespans are about 70 years.", "explanationEn": "The reading says African elephants' lifespans are about 70 years. A: Asian elephants' ears are short. C: African elephants are the very big ones. D: The reading says they are different.", "rubricEn": "", "difficulty": 2, "id": "L2-R06", "lesson": "L2", "explanationZh": "文章說非洲象壽命約 70 年，所以 B 對。容易選 C，但又大又高的是非洲象，亞洲象比較小。", "rubricZh": "", "distractorNotes": ["把非洲象的大耳朵套到亞洲象", "", "把非洲象的體型套到亞洲象", "誤解 be different from（不同）"]}, {"code": "L2-C01", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: the plural of \"this\".", "options": [], "correctIndex": null, "answers": ["these"], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are ____? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "Scott points at the dolls near him (more than one): What are these?", "rubricEn": "", "difficulty": 1, "id": "L2-C01", "lesson": "L2", "explanationZh": "Scott 指著眼前好幾個娃娃問「這些是什麼？」：What are these? 近的、很多個用 these。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C02", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Bella gives a short \"No\" answer (a short form is OK).", "options": [], "correctIndex": null, "answers": ["aren't", "are not"], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they ____. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "Scott asks \"aren't they...?\" Bella says no: No, they aren't. Use a \"No\" form after No.", "rubricEn": "", "difficulty": 2, "id": "L2-C02", "lesson": "L2", "explanationZh": "Scott 問「它們不是生肖嗎？」，Bella 說不是：No, they aren't. 寫 are not 也算對。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C03", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: full of energy; e________.", "options": [], "correctIndex": null, "answers": ["energetic"], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and ____.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "A dragon is smart and energetic. And joins two describing words.", "rubricEn": "", "difficulty": 1, "id": "L2-C03", "lesson": "L2", "explanationZh": "A dragon is smart and energetic.（屬龍的人聰明又有活力）。energetic＝充滿活力。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C04", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: \"No w_____\" means \"That's why!\" or \"That's not a surprise.\"", "options": [], "correctIndex": null, "answers": ["wonder"], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No ____ you are a people person. What about Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "No wonder + sentence = That's why... / It's not a surprise that...", "rubricEn": "", "difficulty": 1, "id": "L2-C04", "lesson": "L2", "explanationZh": "No wonder＝難怪。No wonder you are a people person.＝難怪你人緣這麼好。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C05", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: a____. Scott asks about Abby next.", "options": [], "correctIndex": null, "answers": ["about"], "passage": "(In a movie theater)\nBella: These dolls are cute.\nScott: What are these? Hey, aren't they the Chinese zodiac animal signs?\nBella: No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.\nScott: Wow! What's my animal sign?\nBella: Your birth year is 2000. You're a dragon. A dragon is smart and energetic.\nScott: That's true. What's your animal sign, Bella?\nBella: My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.\nScott: No wonder you are a people person. What ____ Abby the pig?\nBella: Her birth year is 2024. She's a dragon, too.\nScott: No wonder she's smart! Ha ha!", "explanationEn": "What about + noun? asks about the next person or thing. It is like How about...?", "rubricEn": "", "difficulty": 1, "id": "L2-C05", "lesson": "L2", "explanationZh": "What about…?＝那…呢？Scott 問完 Bella，接著問「那 Abby 呢？」。跟 How about 一樣。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C06", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: A is not the same as B. = A is different ____ B.", "options": [], "correctIndex": null, "answers": ["from"], "passage": "Asian Elephants vs. African Elephants\nAre they Asian elephants or African elephants?\n● Size\nAfrican elephants are different ____ Asian elephants. African elephants are very big, and their ears are big, too. Asian elephants are small, and their ears are short. An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall.\n● Lifespan\nAsian elephants' lifespans are about 60 years, but African elephants' lifespans are about 70 years.", "explanationEn": "A is different from B = A and B are not the same.", "rubricEn": "", "difficulty": 1, "id": "L2-C06", "lesson": "L2", "explanationZh": "be different from＝跟…不一樣。例：My bag is different from your bag.", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C07", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: African elephants are tall; Asian elephants are short. Use a word for a difference; b__.", "options": [], "correctIndex": null, "answers": ["but"], "passage": "Asian Elephants vs. African Elephants\nAre they Asian elephants or African elephants?\n● Size\nAfrican elephants are different from Asian elephants. African elephants are very big, and their ears are big, too. Asian elephants are small, and their ears are short. An African elephant is about 3.2 meters tall, ____ an Asian elephant is only about 2.75 meters tall.\n● Lifespan\nAsian elephants' lifespans are about 60 years, but African elephants' lifespans are about 70 years.", "explanationEn": "3.2 meters vs. only 2.75 meters: the two parts are different, so use but.", "rubricEn": "", "difficulty": 2, "id": "L2-C07", "lesson": "L2", "explanationZh": "非洲象 3.2 公尺高，但亞洲象只有 2.75 公尺，前後在對比，用 but（但是）。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-C08", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: how long an animal lives; use the plural form; l________s.", "options": [], "correctIndex": null, "answers": ["lifespans"], "passage": "Asian Elephants vs. African Elephants\nAre they Asian elephants or African elephants?\n● Size\nAfrican elephants are different from Asian elephants. African elephants are very big, and their ears are big, too. Asian elephants are small, and their ears are short. An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall.\n● Lifespan\nAsian elephants' ____ are about 60 years, but African elephants' lifespans are about 70 years.", "explanationEn": "The verb is are, and the next part says African elephants' lifespans, so use the plural: lifespans.", "rubricEn": "", "difficulty": 2, "id": "L2-C08", "lesson": "L2", "explanationZh": "動詞是 are，後面也說 African elephants' lifespans，所以要用複數 lifespans。提醒孩子別忘了 s。", "rubricZh": "", "distractorNotes": []}, {"code": "L2-W01", "category": "sentence", "type": "sentence_writing", "stem": "Write a question and an answer. A asks: What are these? B answers with They're / They are + the plural of an animal from this lesson (for example, rabbits, mice, sheep).", "options": [], "correctIndex": null, "answers": ["A: What are these? B: They're rabbits.", "A: What are these? B: They are mice.", "A: What are these? B: They're sheep."], "passage": null, "explanationEn": "\"What are these?\" is about more than one thing. Answer with they + are + a plural noun.", "rubricEn": "Check: 1) What are these?; 2) They are or They're (not These are or It's); 3) a plural noun with the right spelling (mice, sheep); 4) capital letters and end marks.", "difficulty": 1, "id": "L2-W01", "lesson": "L2", "explanationZh": "問：What are these?（這些是什麼？）答：They're rabbits.（它們是兔子）。很多個要用 They're＋複數。", "rubricZh": "家長檢查：1. 有寫 What are these?；2. 回答用 They are / They're（不是 These are 或 It's）；3. 動物用複數且拼對（mice、sheep 不加 s）；4. 大寫與標點。", "distractorNotes": []}, {"code": "L2-W02", "category": "sentence", "type": "sentence_writing", "stem": "Write a question and an answer. A asks with Is that a(n) ...? (Is it a horse?) B gives a short \"No\" answer first, then says what animal it is (for example, a zebra).", "options": [], "correctIndex": null, "answers": ["A: Is that a horse? B: No, it isn't. It's a zebra.", "A: Is that a horse? B: No, it's not. It's a zebra."], "passage": null, "explanationEn": "For \"Is that...?\" the short answer uses it: No, it isn't. or No, it's not.", "rubricEn": "Check: 1) Is that a horse?; 2) it in the short answer (not that): No, it isn't. / No, it's not.; 3) It's a(n) + animal, with the right a or an.", "difficulty": 2, "id": "L2-W02", "lesson": "L2", "explanationZh": "問：Is that a horse? 答：No, it isn't. It's a zebra. 回答要用 it，不用 that。", "rubricZh": "家長檢查：1. 問句 Is that a horse?；2. 回答用 it（不是 that）：No, it isn't.；3. 再說 It's a(n)＋動物，a/an 用對。", "distractorNotes": []}, {"code": "L2-W03", "category": "sentence", "type": "sentence_writing", "stem": "Use be different from. Write one sentence: your thing is not the same as someone else's (for example, your schoolbag and your sister's schoolbag).", "options": [], "correctIndex": null, "answers": ["My schoolbag is different from my sister's schoolbag.", "My bike is different from your bike.", "My pencil box is different from Tom's."], "passage": null, "explanationEn": "A + be + different from + B means A and B are not the same.", "rubricEn": "Check: 1) be different from; 2) is for one thing, are for many; 3) possessive words are right (my, your, sister's).", "difficulty": 2, "id": "L2-W03", "lesson": "L2", "explanationZh": "句型：A is different from B.（A 跟 B 不一樣）。例：My bike is different from your bike.", "rubricZh": "家長檢查：1. 有用 be different from；2. 一個東西用 is、很多個用 are；3. my、your、sister's 這些「誰的」寫對。", "distractorNotes": []}, {"code": "L2-W04", "category": "sentence", "type": "sentence_writing", "stem": "Write like the lesson. Use My birth year is ... and I'm a(n) ... to tell your birth year and your animal sign. Then add one sentence: A(n) ... is ... (what this animal is like).", "options": [], "correctIndex": null, "answers": ["My birth year is 2013. I'm a snake. A snake is smart.", "My birth year is 2012. I'm a dragon. A dragon is smart and energetic."], "passage": null, "explanationEn": "Like the lesson: Your birth year is 2000. You're a dragon. A dragon is smart and energetic. Use a or an before the animal.", "rubricEn": "Check: 1) My birth year is + a year; 2) a or an before the animal (I'm a dragon, not I'm dragon); 3) A(n) + animal + is + describing word; 4) the year and the animal match (2012 dragon, 2013 snake).", "difficulty": 2, "id": "L2-W04", "lesson": "L2", "explanationZh": "照課文寫三句：My birth year is 2013. I'm a snake. A snake is smart. 注意 I'm a snake 要有 a。", "rubricZh": "家長檢查：1. My birth year is＋年份；2. 生肖前有 a/an（I'm a dragon）；3. 第三句 A(n)＋動物＋is＋形容詞；4. 年份跟生肖對得上（2012 龍、2013 蛇）。", "distractorNotes": []}, {"code": "L2-W05", "category": "sentence", "type": "sentence_writing", "stem": "Use about ... meters tall and but. Write one sentence to compare two people or animals (for example, Dad is about 1.8 meters tall, and you are about 1.5 meters tall).", "options": [], "correctIndex": null, "answers": ["My dad is about 1.8 meters tall, but I am only about 1.5 meters tall.", "An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall."], "passage": null, "explanationEn": "Pattern: subject + be + about + number + meters + tall. Use but to join two different ideas.", "rubricEn": "Check: 1) about + number + meters + tall (meters when the number is more than 1); 2) a comma and but between the two parts; 3) the right be verb for each subject.", "difficulty": 2, "id": "L2-W05", "lesson": "L2", "explanationZh": "句型：…is about＋數字＋meters tall, but…。例：My dad is about 1.8 meters tall, but I am only about 1.5 meters tall.", "rubricZh": "家長檢查：1. about＋數字＋meters tall（超過 1 公尺用 meters）；2. 兩句中間有逗號和 but；3. is/am/are 用對。", "distractorNotes": []}, {"code": "L3-V01", "category": "vocabulary", "type": "single_choice", "stem": "Mom is cooking dinner in the ____.", "options": ["kitchen", "bedroom", "bathroom", "blanket"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "You cook dinner in the kitchen. A bedroom and a bathroom are not for cooking. A blanket is not a room.", "rubricEn": "", "difficulty": 1, "id": "L3-V01", "lesson": "L3", "explanationZh": "煮晚餐的地方是 kitchen 廚房。容易選 blanket，因為字長得有點像，但 blanket 是毛毯，不是房間。", "rubricZh": "", "distractorNotes": ["", "臥室是睡覺的地方，與「煮晚餐」不合", "浴室是洗澡的地方，與「煮晚餐」不合", "blanket 是毛毯，不是一個房間"]}, {"code": "L3-V02", "category": "vocabulary", "type": "single_choice", "stem": "Bella uses her ____ to take a photo and upload it to RoomGPT.", "options": ["blanket", "smartphone", "ice", "theme"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "You use a smartphone to take a photo and upload it. A blanket, ice, and a theme can't take photos.", "rubricEn": "", "difficulty": 1, "id": "L3-V02", "lesson": "L3", "explanationZh": "能拍照、上傳的是 smartphone 智慧型手機。其他是毛毯、冰、主題，都不能拍照。", "rubricZh": "", "distractorNotes": ["毛毯不能拍照", "", "冰不能拍照，且 ice 不可數不加 her 當工具", "theme 是主題，不是拍照的工具"]}, {"code": "L3-V03", "category": "vocabulary", "type": "single_choice", "stem": "This bike costs NT$90,000. It's very ____. I can't buy it.", "options": ["soft", "quiet", "expensive", "cheap"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "NT$90,000 is a lot of money, and I can't buy it, so it is expensive. Cheap means the opposite. Quiet and soft are not about money.", "rubricEn": "", "difficulty": 1, "id": "L3-V03", "lesson": "L3", "explanationZh": "九萬元、我買不起 → 很貴 expensive。容易選 cheap，但 cheap 是便宜，跟「買不起」相反。", "rubricZh": "", "distractorNotes": ["soft 是柔軟的，與價錢無關", "quiet 是安靜的，與價錢無關", "", "cheap 是便宜的，與「買不起」相反"]}, {"code": "L3-V04", "category": "vocabulary", "type": "single_choice", "stem": "This ice bed isn't soft. It's very ____, like a rock.", "options": ["expensive", "soft", "noisy", "hard"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "The bed is not soft, and it is like a rock, so it is hard. The lesson says: It is a big and hard ice bed. Soft doesn't fit. Noisy and expensive are not about how it feels.", "rubricEn": "", "difficulty": 1, "id": "L3-V04", "lesson": "L3", "explanationZh": "不軟、像石頭一樣 → hard 硬的。課文也說 It is a big and hard ice bed. 容易選 soft，但前面才說它不軟。", "rubricZh": "", "distractorNotes": ["expensive 講價錢，和「像石頭一樣」對不上", "與前句 isn't soft 直接矛盾", "noisy 是吵鬧的，不能形容床摸起來像石頭", ""]}, {"code": "L3-V05", "category": "vocabulary", "type": "single_choice", "stem": "Shh! The baby is sleeping. Please be ____.", "options": ["quiet", "noisy", "hard", "expensive"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "The baby is sleeping, so please be quiet. Noisy means the opposite. Hard and expensive don't fit.", "rubricEn": "", "difficulty": 1, "id": "L3-V05", "lesson": "L3", "explanationZh": "寶寶在睡覺，請安靜 be quiet。容易選 noisy，但那是「吵」，意思剛好相反。", "rubricZh": "", "distractorNotes": ["", "noisy 是吵鬧的，與「嬰兒在睡」相反", "hard 形容硬的或困難的，不能用來要求人", "expensive 是昂貴的，不能形容人的行為"]}, {"code": "L3-V06", "category": "vocabulary", "type": "single_choice", "stem": "Step one, ____ a photo. Step two, choose a room type.", "options": ["wait", "upload", "sit", "come"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "First you upload a photo. Wait needs for (wait for). We don't say \"sit a photo\" or \"come a photo.\"", "rubricEn": "", "difficulty": 1, "id": "L3-V06", "lesson": "L3", "explanationZh": "第一步「上傳」照片：upload a photo。容易選 wait，但 wait 要說 wait for，而且意思也不對。", "rubricZh": "", "distractorNotes": ["wait 不直接接受詞，要用 wait for", "", "sit 不能接 a photo", "come 是不及物動詞，不能接 a photo"]}, {"code": "L3-V07", "category": "vocabulary", "type": "single_choice", "stem": "It's cold. Please cover the baby with this ____.", "options": ["tool", "ice", "blanket", "photo"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "You cover a baby with a blanket to keep warm. Ice is cold. A tool and a photo can't keep you warm.", "rubricEn": "", "difficulty": 1, "id": "L3-V07", "lesson": "L3", "explanationZh": "天冷，用 blanket 毛毯蓋寶寶。容易選 ice，冰只會更冷。", "rubricZh": "", "distractorNotes": ["工具不能拿來蓋身體保暖", "冰會讓寶寶更冷，與「天冷要蓋」矛盾", "", "照片不能拿來蓋身體保暖"]}, {"code": "L3-V08", "category": "vocabulary", "type": "single_choice", "stem": "Which word means the same as \"next to\"?", "options": ["inside", "behind", "between", "beside"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Next to and beside both mean \"at the side of.\" Behind is at the back, between is in the middle, and inside is in something.", "rubricEn": "", "difficulty": 1, "id": "L3-V08", "lesson": "L3", "explanationZh": "next to 和 beside 都是「在…旁邊」。容易選 between，但 between 是「在兩個東西中間」。", "rubricZh": "", "distractorNotes": ["inside 是「在…裡面」", "behind 是「在…後面」", "between 是「在…中間」", ""]}, {"code": "L3-V09", "category": "vocabulary", "type": "single_choice", "stem": "There are many ____ of flowers in the garden: roses, lilies, and sunflowers.", "options": ["types", "steps", "questions", "themes"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "Roses, lilies, and sunflowers are different types (kinds) of flowers. Steps, questions, and themes are not kinds of flowers.", "rubricEn": "", "difficulty": 2, "id": "L3-V09", "lesson": "L3", "explanationZh": "玫瑰、百合、向日葵是不同「種類」的花：types of flowers。容易選 themes，但 theme 是主題，不是種類。", "rubricZh": "", "distractorNotes": ["", "steps 是步驟，不能說「很多步驟的花」", "questions 是問題，與花的種類無關", "themes 是主題，不是用來分類花的詞"]}, {"code": "L3-V10", "category": "vocabulary", "type": "single_choice", "stem": "Tom looks very young. In ____, he is fifty years old.", "options": ["idea", "fact", "style", "world"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "In fact means \"really\" or \"the truth is.\" Tom looks young, but really he is fifty. \"In idea\" and \"in world\" are not phrases. \"In style\" means fashionable.", "rubricEn": "", "difficulty": 2, "id": "L3-V10", "lesson": "L3", "explanationZh": "in fact＝事實上。Tom 看起來很年輕，事實上已經五十歲。例：He looks shy. In fact, he talks a lot.", "rubricZh": "", "distractorNotes": ["沒有 in idea 這個片語", "", "in style 是「流行的」，放這裡不通", "in world 不成片語（in the world 是「世界上」）"]}, {"code": "L3-G01", "category": "grammar", "type": "single_choice", "stem": "A: Where ____ your shoes? B: They're under the bed.", "options": ["am", "is", "are", "be"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Your shoes is plural, so use are: Where are your shoes? Is is for one
