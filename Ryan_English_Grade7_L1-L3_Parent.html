 thing. Am is only for I. Be can't be used here.", "rubricEn": "", "difficulty": 1, "id": "L3-G01", "lesson": "L3", "explanationZh": "your shoes（鞋子，一雙＝很多隻）是複數，用 are：Where are your shoes? 容易選 is，但 is 給單數用。", "rubricZh": "", "distractorNotes": ["am 只和 I 搭配", "shoes 是複數，不能用 is", "", "疑問句要用變化後的 be 動詞，不能用原形 be"]}, {"code": "L3-G02", "category": "grammar", "type": "single_choice", "stem": "A: Where is Mom? B: ____", "options": ["She's a teacher.", "Yes, she is.", "No, she isn't.", "She's in the kitchen."], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Where asks about a place, so answer with a place: She's in the kitchen. Yes/No answers are for be-verb questions. \"She's a teacher\" is about a job.", "rubricEn": "", "difficulty": 1, "id": "L3-G02", "lesson": "L3", "explanationZh": "Where 問「在哪裡」，就回答地點：She's in the kitchen.（她在廚房）。容易選 Yes, she is.，但 Where 的問題不能回答 Yes/No。", "rubricZh": "", "distractorNotes": ["回答的是職業，不是地點", "Where 問地點，不能用 Yes/No 回答", "Where 問地點，不能用 Yes/No 回答", ""]}, {"code": "L3-G03", "category": "grammar", "type": "single_choice", "stem": "A: Is the cat under the table? B: ____ It's on the sofa.", "options": ["Yes, it isn't.", "Yes, it is.", "No, it is.", "No, it isn't."], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "The cat is on the sofa, so it is not under the table: No, it isn't. \"Yes, it is\" doesn't match. Use No with isn't and Yes with is.", "rubricEn": "", "difficulty": 2, "id": "L3-G03", "lesson": "L3", "explanationZh": "後面說貓在沙發上，所以不在桌子下：No, it isn't. 提醒：No 配 isn't、Yes 配 is，不能混在一起。", "rubricZh": "", "distractorNotes": ["Yes 後面要接肯定 is", "後句說牠在沙發上，前面不能回答 Yes", "No 後面要接否定 isn't", ""]}, {"code": "L3-G04", "category": "grammar", "type": "single_choice", "stem": "____ run in the classroom, Tom.", "options": ["Don't", "Not", "No", "Doesn't"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "To tell someone not to do something: Don't + verb. Not and No can't go right before the verb here. We don't use Doesn't in this kind of sentence.", "rubricEn": "", "difficulty": 1, "id": "L3-G04", "lesson": "L3", "explanationZh": "叫別人「不要…」：Don't＋動詞，Don't run.（不要跑）。容易選 No，但英文不說 No run in the classroom 這種句子。", "rubricZh": "", "distractorNotes": ["", "否定祈使句要用 Don't，不能只用 Not", "No 不能放在原形動詞前形成祈使句", "祈使句的主詞是省略的 you，不用 doesn't"]}, {"code": "L3-G05", "category": "grammar", "type": "single_choice", "stem": "Please ____ nice to your little sister.", "options": ["is", "be", "are", "am"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "Please + base verb. Nice is a describing word, so use be: Please be nice. Is, are, and am are not the base form.", "rubricEn": "", "difficulty": 1, "id": "L3-G05", "lesson": "L3", "explanationZh": "Please 後面接原形動詞；nice 是形容詞，所以用 be：Please be nice.（請對妹妹好一點）。容易選 is，但 Please 後面不能接 is。", "rubricZh": "", "distractorNotes": ["祈使句要用原形動詞，is 不是原形", "", "祈使句要用原形動詞，are 不是原形", "祈使句要用原形動詞，am 不是原形"]}, {"code": "L3-G06", "category": "grammar", "type": "single_choice", "stem": "It's cold here. ____ go inside.", "options": ["Lets", "Let", "Let's", "Let's to"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Let's + verb = We should do it together: Let's go inside. Let needs us. Lets needs an apostrophe ('). Don't put to after Let's.", "rubricEn": "", "difficulty": 1, "id": "L3-G06", "lesson": "L3", "explanationZh": "Let's＋動詞＝我們一起…吧：Let's go inside.（我們進去吧）。容易選 Lets，但少了那一撇。", "rubricZh": "", "distractorNotes": ["表示「我們一起…吧」要寫 Let's，少了縮寫符號", "let 後面要接受詞（如 us），單獨 Let go inside 不通", "", "Let's 後面直接接原形動詞，不加 to"]}, {"code": "L3-G07", "category": "grammar", "type": "single_choice", "stem": "It's very late. ____ watch TV now. Let's go to bed.", "options": ["Let not", "Let's don't", "Not let's", "Let's not"], "correctIndex": 3, "answers": [], "passage": null, "explanationEn": "Let's not + verb = We shouldn't do it: Let's not watch TV now. \"Let's don't\" is wrong. \"Not let's\" has the wrong order. \"Let not\" is missing 's.", "rubricEn": "", "difficulty": 2, "id": "L3-G07", "lesson": "L3", "explanationZh": "「我們不要…吧」是 Let's not＋動詞：Let's not watch TV now. 容易選 Let's don't，但英文不這樣說。", "rubricZh": "", "distractorNotes": ["少了 us（'s），意思變成「不要讓」", "Let's 的否定是在後面加 not，不加 don't", "not 要放在 Let's 後面", ""]}, {"code": "L3-G08", "category": "grammar", "type": "single_choice", "stem": "Look at Kevin. He's alone. Let's play with ____.", "options": ["him", "he", "his", "them"], "correctIndex": 0, "answers": [], "passage": null, "explanationEn": "After with, use him (for one boy): play with him. He is a subject word. His means \"belongs to him.\" Them is for many people.", "rubricEn": "", "difficulty": 1, "id": "L3-G08", "lesson": "L3", "explanationZh": "with（跟）後面要用 him：play with him（跟他玩）。容易選 he，但 he 只能當句子的主角放前面。", "rubricZh": "", "distractorNotes": ["", "he 是主格，介系詞 with 後面要用受格", "his 是所有格，後面要接名詞", "them 指多人，Kevin 只有一個人"]}, {"code": "L3-G09", "category": "grammar", "type": "single_choice", "stem": "Don't go! Wait for ____. We're coming.", "options": ["we", "us", "our", "me"], "correctIndex": 1, "answers": [], "passage": null, "explanationEn": "After for, use us: Wait for us. The next sentence says We're coming. We is a subject word. Our means \"belongs to us.\" Me is only one person.", "rubricEn": "", "difficulty": 2, "id": "L3-G09", "lesson": "L3", "explanationZh": "Wait for us.＝等等我們。for 後面用 us；下一句 We're coming 說是「我們」。容易選 we，但 we 是放句首當主角用的。", "rubricZh": "", "distractorNotes": ["we 是主格，介系詞 for 後面要用受格", "", "our 是所有格，後面要接名詞", "後句說 We're coming，是「我們」不是「我」"]}, {"code": "L3-G10", "category": "grammar", "type": "single_choice", "stem": "The bank is between the school ____ the park.", "options": ["to", "or", "and", "with"], "correctIndex": 2, "answers": [], "passage": null, "explanationEn": "Between A and B always uses and. Or, to, and with don't go with between.", "rubricEn": "", "difficulty": 1, "id": "L3-G10", "lesson": "L3", "explanationZh": "between A and B＝在 A 和 B 中間，固定用 and。例：I sit between Mom and Dad.", "rubricZh": "", "distractorNotes": ["between 不和 to 搭配", "固定搭配是 between A and B，不用 or", "", "between 不和 with 搭配"]}, {"code": "L3-R01", "category": "reading", "type": "single_choice", "stem": "Where is Jenny's bed?", "options": ["It is in the living room of a big house.", "It is next to the table.", "It is inside a cave.", "It is beside the kitchen."], "correctIndex": 3, "answers": [], "passage": "Beds\nIs your bed big and soft, or is it small and hard? In fact, beds around the world are different. Let's meet two new friends and their beds.\nJenny is an eleven-year-old girl. Her house is an igloo. This is her bedroom, kitchen, living room, and dining room, too. Where is her bed? It is beside the kitchen. It is a big and hard ice bed.\nJason is twenty-one years old. His house is inside a cave. Where is his bed? It is next to the table. It is a small and old blanket.", "explanationEn": "The reading says: Where is her bed? It is beside the kitchen. Next to the table is Jason's bed. The cave is Jason's house. Jenny lives in an igloo, not a big house.", "rubricEn": "", "difficulty": 1, "id": "L3-R01", "lesson": "L3", "explanationZh": "課文說 Jenny 的床 It is beside the kitchen（在廚房旁邊）。容易選 next to the table，但那是 Jason 的床。", "rubricZh": "", "distractorNotes": ["Jenny 住在冰屋，不是大房子", "這是 Jason 的床的位置", "住在洞穴裡的是 Jason", ""]}, {"code": "L3-R02", "category": "reading", "type": "single_choice", "stem": "Which is TRUE about Jason?", "options": ["His house is inside a cave.", "He is eleven years old.", "His bed is big and hard.", "He lives in an igloo."], "correctIndex": 0, "answers": [], "passage": "Beds\nIs your bed big and soft, or is it small and hard? In fact, beds around the world are different. Let's meet two new friends and their beds.\nJenny is an eleven-year-old girl. Her house is an igloo. This is her bedroom, kitchen, living room, and dining room, too. Where is her bed? It is beside the kitchen. It is a big and hard ice bed.\nJason is twenty-one years old. His house is inside a cave. Where is his bed? It is next to the table. It is a small and old blanket.", "explanationEn": "The reading says: His house is inside a cave. Eleven years old, the big and hard bed, and the igloo are all about Jenny.", "rubricEn": "", "difficulty": 1, "id": "L3-R02", "lesson": "L3", "explanationZh": "課文說 Jason 的家 inside a cave（在山洞裡）。容易選 He is eleven years old，但 11 歲的是 Jenny。", "rubricZh": "", "distractorNotes": ["", "十一歲的是 Jenny，Jason 二十一歲", "又大又硬的冰床是 Jenny 的", "住冰屋的是 Jenny"]}, {"code": "L3-R03", "category": "reading", "type": "single_choice", "stem": "\"This is her bedroom, kitchen, living room, and dining room, too.\" What does this sentence tell us about Jenny's igloo?", "options": ["It has four big rooms.", "It is her bedroom, kitchen, living room, and dining room at the same time.", "It has no kitchen.", "Her bed is in the dining room."], "correctIndex": 1, "answers": [], "passage": "Beds\nIs your bed big and soft, or is it small and hard? In fact, beds around the world are different. Let's meet two new friends and their beds.\nJenny is an eleven-year-old girl. Her house is an igloo. This is her bedroom, kitchen, living room, and dining room, too. Where is her bed? It is beside the kitchen. It is a big and hard ice bed.\nJason is twenty-one years old. His house is inside a cave. Where is his bed? It is next to the table. It is a small and old blanket.", "explanationEn": "This means the igloo. The one igloo is her bedroom, kitchen, living room, and dining room at the same time. It is not four rooms. It has a kitchen. Her bed is beside the kitchen.", "rubricEn": "", "difficulty": 3, "id": "L3-R03", "lesson": "L3", "explanationZh": "This 指整個冰屋：同一個空間同時當臥室、廚房、客廳、飯廳。容易選「有四個大房間」，但其實只有一個空間。", "rubricZh": "", "distractorNotes": ["誤以為列出四個房間就是有四間", "", "課文明說它也是廚房", "課文說床在廚房旁邊，沒說在飯廳"]}, {"code": "L3-R04", "category": "reading", "type": "single_choice", "stem": "Where is Bella's smartphone?", "options": ["In her bag.", "On the table.", "Under the bed.", "In the kitchen."], "correctIndex": 1, "answers": [], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "Bella asks where her smartphone is, and Scott says: It's on the table. The bag, the bed, and the kitchen are not in the dialogue.", "rubricEn": "", "difficulty": 1, "id": "L3-R04", "lesson": "L3", "explanationZh": "Bella 問手機在哪，Scott 說 It's on the table.（在桌上）。其他地方對話都沒提到。", "rubricZh": "", "distractorNotes": ["對話沒有提到包包", "", "對話沒有提到床", "對話沒有提到廚房"]}, {"code": "L3-R05", "category": "reading", "type": "single_choice", "stem": "Why does Bella talk about a makeover?", "options": ["Scott's house is too small.", "Scott's house is very noisy.", "Scott says his house is not really his style.", "Bella wants a new smartphone."], "correctIndex": 2, "answers": [], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "Scott says, \"it's not really my style,\" so Bella says, \"what about a makeover?\" Bella says the house is nice and quiet, so it is not noisy. The dialogue doesn't say it is small or that Bella wants a new phone.", "rubricEn": "", "difficulty": 2, "id": "L3-R05", "lesson": "L3", "explanationZh": "Scott 說 it's not really my style（不太是我的風格），Bella 才提議改造。容易選 noisy，但 Bella 說房子 nice and quiet，很安靜。", "rubricZh": "", "distractorNotes": ["對話沒有提到房子太小", "Bella 說房子 nice and quiet，不是吵", "", "她只是在找手機，沒有想買新的"]}, {"code": "L3-R06", "category": "reading", "type": "single_choice", "stem": "Bella asks, \"A big makeover is expensive. Are you OK with that?\" Scott says, \"Ha! That's a good question.\" What does Scott mean?", "options": ["He wants to choose another theme.", "He thinks the question is easy.", "He is happy to pay a lot of money.", "He doesn't really know the answer."], "correctIndex": 3, "answers": [], "passage": "Bella: OK, look at this. Step one, upload a photo. Step two, choose a room type.\nScott: Room type?\nBella: Yes. The living room, the bathroom, or the bedroom?\nScott: The bedroom. What's next?\nBella: Choose a room theme.\nScott: Wow! These themes are really cool!\nBella: Wait. A big makeover is expensive. Are you OK with that?\nScott: Ha! That's a good question.", "explanationEn": "Here, \"That's a good question\" means Scott doesn't really know what to say. He doesn't say it is easy, he doesn't say he will pay a lot, and he doesn't talk about a new theme.", "rubricEn": "", "difficulty": 3, "id": "L3-R06", "lesson": "L3", "explanationZh": "That's a good question 在這裡是「呃…這我也不知道耶」的意思，Scott 用它帶過。容易選「他覺得問題很簡單」，但他其實答不出來。", "rubricZh": "", "distractorNotes": ["對話沒有說要換主題", "誤把字面的 good 當成「簡單」", "他沒有回答 OK，不能推出他樂意花錢", ""]}, {"code": "L3-C01", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: the opposite of out; i_.", "options": [], "correctIndex": null, "answers": ["in"], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come ____.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "Come in = enter. Please come in. is what you say to welcome someone.", "rubricEn": "", "difficulty": 1, "id": "L3-C01", "lesson": "L3", "explanationZh": "Please come in.＝請進。in 是「進來」，out 是「出去」。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C02", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: not noisy; q____.", "options": [], "correctIndex": null, "answers": ["quiet"], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and ____.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "Nice and quiet = nice and not noisy.", "rubricEn": "", "difficulty": 1, "id": "L3-C02", "lesson": "L3", "explanationZh": "nice and quiet＝很棒又安靜。quiet 是安靜的，相反是 noisy。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C03", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: a____. (What ____ ...? is like How about ...?)", "options": [], "correctIndex": null, "answers": ["about"], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what ____ a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "What about + noun? gives an idea. It is like How about...?", "rubricEn": "", "difficulty": 1, "id": "L3-C03", "lesson": "L3", "explanationZh": "What about…?＝…怎麼樣？用來提建議，跟 How about 一樣。例：What about pizza for dinner?", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C04", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: The ideas come f___ RoomGPT.", "options": [], "correctIndex": null, "answers": ["from"], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas ____ RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's on the table.", "explanationEn": "Get something from someone or something: get ideas from RoomGPT.", "rubricEn": "", "difficulty": 1, "id": "L3-C04", "lesson": "L3", "explanationZh": "get ideas from RoomGPT＝從 RoomGPT 得到點子。from＝從。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C05", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: The phone is at the top of the table; o_.", "options": [], "correctIndex": null, "answers": ["on"], "passage": "(At Scott's home)\nScott: Welcome, Bella! Please come in.\nBella: Thank you, Scott. Your house is nice and quiet.\nScott: Thanks, but it's not really my style.\nBella: Oh, I see. Well, what about a makeover?\nScott: Great idea! But how?\nBella: Let's get some ideas from RoomGPT.\nScott: RoomGPT? What's that?\nBella: It is an AI tool. Uh, where is my smartphone?\nScott: It's ____ the table.", "explanationEn": "The phone is on top of the table and touches it, so use on: on the table.", "rubricEn": "", "difficulty": 1, "id": "L3-C05", "lesson": "L3", "explanationZh": "手機放在桌面上，用 on：on the table。對照 under the table 是在桌子下面。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C06", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: pick; c_____.", "options": [], "correctIndex": null, "answers": ["choose"], "passage": "Bella: OK, look at this. Step one, upload a photo. Step two, ____ a room type.\nScott: Room type?\nBella: Yes. The living room, the bathroom, or the bedroom?\nScott: The bedroom. What's next?\nBella: Choose a room theme.\nScott: Wow! These themes are really cool!\nBella: Wait. A big makeover is expensive. Are you OK with that?\nScott: Ha! That's a good question.", "explanationEn": "Step two tells you what to do, so use the base verb: choose a room type.", "rubricEn": "", "difficulty": 1, "id": "L3-C06", "lesson": "L3", "explanationZh": "第二步「選擇」房間種類：choose a room type。choose＝選。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C07", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: Are you OK w___ that? = Is that OK for you?", "options": [], "correctIndex": null, "answers": ["with"], "passage": "Bella: OK, look at this. Step one, upload a photo. Step two, choose a room type.\nScott: Room type?\nBella: Yes. The living room, the bathroom, or the bedroom?\nScott: The bedroom. What's next?\nBella: Choose a room theme.\nScott: Wow! These themes are really cool!\nBella: Wait. A big makeover is expensive. Are you OK ____ that?\nScott: Ha! That's a good question.", "explanationEn": "Be OK with something = it's fine for you.", "rubricEn": "", "difficulty": 2, "id": "L3-C07", "lesson": "L3", "explanationZh": "Are you OK with that?＝你可以接受嗎？be OK with＝對…沒問題。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-C08", "category": "cloze", "type": "fill_blank", "stem": "Fill in the blank. Hint: the opposite of outside.", "options": [], "correctIndex": null, "answers": ["inside", "in"], "passage": "Beds\nIs your bed big and soft, or is it small and hard? In fact, beds around the world are different. Let's meet two new friends and their beds.\nJenny is an eleven-year-old girl. Her house is an igloo. This is her bedroom, kitchen, living room, and dining room, too. Where is her bed? It is beside the kitchen. It is a big and hard ice bed.\nJason is twenty-one years old. His house is ____ a cave. Where is his bed? It is next to the table. It is a small and old blanket.", "explanationEn": "His house is inside a cave. Inside = in. \"In\" is also OK.", "rubricEn": "", "difficulty": 2, "id": "L3-C08", "lesson": "L3", "explanationZh": "His house is inside a cave.（他的家在山洞裡），inside＝在裡面；寫 in 也算對。", "rubricZh": "", "distractorNotes": []}, {"code": "L3-W01", "category": "sentence", "type": "sentence_writing", "stem": "Use Where are ...? to ask where someone's books are. Then answer with a full sentence. Use under.", "options": [], "correctIndex": null, "answers": ["A: Where are your books? B: They are under the desk.", "A: Where are your books? B: They're under the bed."], "passage": null, "explanationEn": "Where asks about a place. Books is plural, so use are, and answer with They.", "rubricEn": "Check: 1) Where are + a plural noun; 2) They + are + under + the + noun; 3) no Yes or No in the answer; 4) capital letters and a question mark.", "difficulty": 2, "id": "L3-W01", "lesson": "L3", "explanationZh": "問：Where are your books?（你的書在哪？）答：They are under the desk.（在桌子下面）。很多本書用 are、They。", "rubricZh": "家長檢查：1. 問句 Where are＋很多個東西；2. 回答 They are under the＋名詞；3. 回答沒有 Yes/No；4. 大寫、問號。", "distractorNotes": []}, {"code": "L3-W02", "category": "sentence", "type": "sentence_writing", "stem": "Start with a be verb (Is ...?). Ask if Ann is in the park. Then write a short \"No\" answer.", "options": [], "correctIndex": null, "answers": ["A: Is Ann in the park? B: No, she isn't.", "A: Is Ann in the park? B: No, she's not."], "passage": null, "explanationEn": "A question with Is at the start needs Yes or No. In the short answer, change Ann to she: No, she isn't.", "rubricEn": "Check: 1) Is Ann in the park? (Is at the start); 2) she in the answer, not Ann; 3) No, she isn't.; 4) the right end marks.", "difficulty": 2, "id": "L3-W02", "lesson": "L3", "explanationZh": "問：Is Ann in the park? 答：No, she isn't. 回答要把 Ann 換成 she。", "rubricZh": "家長檢查：1. Is 放句首：Is Ann in the park?；2. 回答用 she 不用 Ann；3. No, she isn't.；4. 標點正確。", "distractorNotes": []}, {"code": "L3-W03", "category": "sentence", "type": "sentence_writing", "stem": "Use please and don't. Tell the students not to talk in the library.", "options": [], "correctIndex": null, "answers": ["Please don't talk in the library, students.", "Students, please don't talk in the library.", "Please don't talk in the library."], "passage": null, "explanationEn": "Don't + verb tells someone not to do something. Please can go at the start or the end. Use a comma before or after the name you call (students).", "rubricEn": "Check: 1) don't + talk; 2) please at the start or the end (with a comma before it at the end); 3) a comma next to students; 4) no you and no doesn't.", "difficulty": 2, "id": "L3-W03", "lesson": "L3", "explanationZh": "例：Please don't talk in the library.（請不要在圖書館講話）。Don't＋動詞＝不要…。", "rubricZh": "家長檢查：1. 有 don't talk；2. 有 please，放句首或句尾都可以（放句尾前面加逗號）；3. 叫 students 時用逗號隔開；4. 沒有寫 you 或 doesn't。", "distractorNotes": []}, {"code": "L3-W04", "category": "sentence", "type": "sentence_writing", "stem": "Write a sentence with Let's ... Use them for my cousins. First say my cousins (for example: They are my cousins.). Then ask everyone to go to the park or play in the park with them.", "options": [], "correctIndex": null, "answers": ["My cousins are here. Let's play with them in the park.", "These are my cousins. Let's go to the park with them."], "passage": null, "explanationEn": "Let's + verb = we can do it together. After with, use them, not they.", "rubricEn": "Check: 1) Let's + base verb; 2) with them (not they or their); 3) the sentence makes sense and the end marks are right.", "difficulty": 2, "id": "L3-W04", "lesson": "L3", "explanationZh": "例：These are my cousins. Let's go to the park with them. 先說 my cousins，再用 them 代替。with 後面用 them，不是 they。", "rubricZh": "家長檢查：1. Let's＋動詞原形；2. with 後面是 them（不是 they 或 their）；3. 句子通順、標點正確。", "distractorNotes": []}, {"code": "L3-W05", "category": "sentence", "type": "sentence_writing", "stem": "Use between ... and ... to tell where one thing in your room is (for example, your bed).", "options": [], "correctIndex": null, "answers": ["My bed is between the desk and the window.", "The lamp is between the bed and the closet."], "passage": null, "explanationEn": "Between A and B = in the middle of A and B. Use the right be verb.", "rubricEn": "Check: 1) subject + be + between A and B; 2) and, not or; 3) is for one thing, are for many; 4) the or my before the nouns.", "difficulty": 2, "id": "L3-W05", "lesson": "L3", "explanationZh": "例：My bed is between the desk and the window.（我的床在書桌和窗戶中間）。between 一定配 and。", "rubricZh": "家長檢查：1. 主詞＋is/are＋between A and B；2. 用 and 不是 or；3. 一個東西用 is、很多個用 are；4. 名詞前有 the 或 my。", "distractorNotes": []}];
const CAT = {vocabulary:"單字",grammar:"文法",reading:"閱讀",cloze:"填空",sentence:"造句"};
const CAT_ORDER = ["vocabulary","grammar","reading","cloze","sentence"];
let lesson = "all", cats = CAT_ORDER.slice(), codes = null;

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = String(text); return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function letter(i){ return String.fromCharCode(65+i); }

function parseCodes(s){
  const out = [], bad = [];
  String(s).toUpperCase().split(/[\s,，、;；]+/).filter(Boolean).forEach(t => {
    const m = t.match(/^L([1-3])-?([VGRCW])-?(\d{1,2})$/);
    if(m){ const c = "L" + m[1] + "-" + m[2] + String(parseInt(m[3],10)).padStart(2,"0"); if(QUESTIONS.some(q => q.code === c)) out.push(c); else bad.push(t); }
    else bad.push(t);
  });
  return {out, bad};
}

function buildChips(){
  const lc = $("lessonChips"); clear(lc);
  [["all","全部"],["L1","L1 "+LESSONS.L1],["L2","L2 "+LESSONS.L2],["L3","L3 "+LESSONS.L3]].forEach(([v,t]) => {
    const b = el("button","chip",t); b.type="button"; b.classList.toggle("active", lesson === v);
    b.onclick = () => { lesson = v; codes = null; $("codeWarn").textContent = ""; buildChips(); render(); };
    lc.appendChild(b);
  });
  const cc = $("catChips"); clear(cc);
  CAT_ORDER.forEach(c => {
    const b = el("button","chip",CAT[c]); b.type="button"; b.classList.toggle("active", cats.includes(c));
    b.onclick = () => { if(cats.includes(c)){ if(cats.length > 1) cats = cats.filter(x => x !== c); } else cats.push(c); codes = null; $("codeWarn").textContent = ""; buildChips(); render(); };
    cc.appendChild(b);
  });
}

function sec(title, bodyNode, cls){ const s = el("div","sec"); s.appendChild(el("h4",null,title)); bodyNode.classList.add("body"); if(cls) bodyNode.classList.add(cls); s.appendChild(bodyNode); return s; }

function card(q){
  const d = el("div","q"); d.id = "q-" + q.code;
  const h = el("div","qh");
  h.appendChild(el("span","code",q.code)); h.appendChild(el("span","badge",CAT[q.category]));
  h.appendChild(el("span","unit", q.lesson + " " + LESSONS[q.lesson] + "　難度 " + q.difficulty));
  d.appendChild(h);
  if(q.passage){ const det = el("details"); det.appendChild(el("summary",null,"展開課文／短文")); det.appendChild(el("div","passage",q.passage)); d.appendChild(det); }
  d.appendChild(el("div","stem",q.stem));
  if(q.type === "single_choice"){
    const ol = el("ol","opts");
    q.options.forEach((o,i) => { const li = el("li", i === q.correctIndex ? "correct" : null, letter(i) + ". " + o + (i === q.correctIndex ? "　✓ 正解" : "")); ol.appendChild(li); });
    d.appendChild(ol);
    d.appendChild(sec("正解", el("div","ans", letter(q.correctIndex) + ". " + q.options[q.correctIndex])));
  } else if(q.type === "fill_blank"){
    d.appendChild(sec("正解（以下任一都算對，大小寫不拘）", el("div","ans", q.answers.join(" / "))));
  } else {
    const ul = el("ul","dn"); q.answers.forEach(a => ul.appendChild(el("li",null,a)));
    d.appendChild(sec("參考句", ul));
  }
  d.appendChild(sec("英文解析（孩子作答後看到的）", el("div",null,q.explanationEn)));
  d.appendChild(sec("家長中文解析（可以直接照著講）", el("div",null,q.explanationZh), "zh"));
  if(q.type === "single_choice" && Array.isArray(q.distractorNotes) && q.distractorNotes.some(Boolean)){
    const ul = el("ul","dn");
    q.distractorNotes.forEach((n,i) => { if(n && i !== q.correctIndex) ul.appendChild(el("li",null, letter(i) + ". " + q.options[i] + " → " + n)); });
    d.appendChild(sec("選錯的選項代表什麼誤解", ul));
  }
  if(q.type === "sentence_writing"){
    d.appendChild(sec("家長檢查要點", el("div",null,q.rubricZh), "zh"));
    d.appendChild(sec("孩子看到的英文檢查清單", el("div",null,q.rubricEn)));
  }
  return d;
}

function render(){
  const list = $("list"); clear(list);
  let qs;
  if(codes){ qs = codes.map(c => QUESTIONS.find(q => q.code === c)).filter(Boolean); }
  else qs = QUESTIONS.filter(q => (lesson === "all" || q.lesson === lesson) && cats.includes(q.category));
  $("count").textContent = (codes ? "依代號顯示 " : "共 ") + qs.length + " 題";
  qs.forEach(q => list.appendChild(card(q)));
  if(!qs.length) list.appendChild(el("p","hint","沒有符合的題目。"));
}

$("codeApply").onclick = () => {
  const {out, bad} = parseCodes($("codeInput").value);
  $("codeWarn").textContent = bad.length ? "找不到這些代號：" + bad.join(", ") : "";
  codes = out.length ? Array.from(new Set(out)) : null;
  if(!out.length && !bad.length) $("codeWarn").textContent = "請先輸入代號。";
  render();
};
$("codeInput").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); $("codeApply").click(); } });
$("codeClear").onclick = () => { $("codeInput").value = ""; codes = null; $("codeWarn").textContent = ""; render(); };
let expanded = false;
$("expandAll").onclick = () => { expanded = !expanded; document.querySelectorAll("#list details").forEach(x => x.open = expanded); $("expandAll").textContent = expanded ? "收合全部課文" : "展開全部課文"; };
let opened = [];
window.addEventListener("beforeprint", () => { opened = []; document.querySelectorAll("#list details").forEach(x => { if(!x.open){ x.open = true; opened.push(x); } }); });
window.addEventListener("afterprint", () => { opened.forEach(x => x.open = false); opened = []; });
$("printBtn").onclick = () => { try{ window.print(); }catch(e){} };

const fromHash = decodeURIComponent((location.hash || "").replace(/^#/,""));
if(fromHash){ $("codeInput").value = fromHash; }
buildChips();
if(fromHash) $("codeApply").click(); else render();
</script>
</body>
</html>
