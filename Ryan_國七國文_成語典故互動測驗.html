<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryan 國七國文段考｜成語典故挑戰</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#192638;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:22px 16px 65px}header{background:linear-gradient(120deg,#173a69,#236b9c);color:white;padding:27px;border-radius:22px}h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px)}header p{margin:0;opacity:.9}.panel{background:white;border:1px solid #e3e9f0;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 5px 22px #20364d0a}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,select{font:inherit;border-radius:12px;padding:12px 15px;border:1px solid #cbd7e5;background:white;color:#173a69;cursor:pointer}button.primary{background:#175fa2;color:white;border-color:#175fa2}button:disabled{opacity:.48;cursor:default}.meta{color:#60748a;font-size:14px}.question{font-size:21px;font-weight:750;line-height:1.7;margin:15px 0}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:15px;border:2px solid #e1e9f1;border-radius:12px;color:#24364b;background:#fff}.option:hover:not(:disabled){border-color:#3288cf;background:#f5faff}.option.good{border-color:#2c9864;background:#eaf8f0}.option.bad{border-color:#cf5151;background:#fff0f0}.feedback{padding:16px;border-radius:12px;background:#eef6ff;line-height:1.8;margin-top:15px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.stat{background:#eaf3ff;border-radius:12px;padding:12px 16px;font-weight:650}.progress{height:10px;background:#e5edf6;border-radius:10px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#2e8bd0;width:0;transition:.25s}.hide{display:none}.note{font-size:14px;color:#60748a;line-height:1.8}footer{color:#63768b;text-align:center;margin-top:24px;font-size:13px}</style></head><body><div class="wrap"><header><h1>📚 Ryan 國文段考挑戰</h1><p>10/14 國七第一次段考｜成語習作 1–6 回 × 讀典故知文史 p.8–59</p></header><div class="panel" id="setup"><h2>開始練習</h2><p class="note">每題選完立刻顯示正解與解析。可選成語、典故或混合題；答錯的題目可集中重練。</p><div class="toolbar"><label>範圍 <select id="mode"><option value="all">全部混合</option><option value="成語">成語應用</option><option value="典故">典故理解</option></select></label><label>題數 <select id="count"><option value="15">15 題</option><option value="30">30 題</option><option value="999">全部題目</option></select></label><button class="primary" onclick="start()">開始測驗 →</button><button onclick="retryWrong()">重練上次錯題</button></div><div class="stats"><div class="stat" id="bank"></div><div class="stat" id="last"></div></div></div><div class="panel hide" id="quiz"><div class="toolbar" style="justify-content:space-between"><span class="meta" id="position"></span><span class="meta" id="score"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="meta" id="source"></div><div class="question" id="question"></div><div id="choices"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="toolbar" style="margin-top:18px"><button class="primary hide" id="next" onclick="next()">下一題 →</button><button onclick="back()">返回選單</button></div></div><div class="panel hide" id="result"><h2>🎉 完成測驗！</h2><div class="stats" id="summary"></div><p id="advice"></p><div class="toolbar"><button class="primary" onclick="retryWrong()">只練錯題</button><button onclick="back()">返回選單</button></div></div><footer>本測驗為依照上傳教材編寫的練習題，非學校正式試題。資料儲存在本裝置瀏覽器中。</footer></div><script>const BANK=[{"cat": "成語", "src": "第1回", "q": "Ryan 考前把每一天的複習時間都安排妥當，準備十分周全。最適合形容？", "opts": ["才高八斗", "十拿九穩", "毛骨悚然", "沒沒無聞"], "a": 1, "why": "「十拿九穩」比喻做事很有把握；安排妥當不必然保證結果，題意著重準備周全後的把握。"}, {"cat": "成語", "src": "第1回", "q": "老師一再提醒，他卻完全不把話放在心上。哪個成語最貼切？", "opts": ["見微知著", "充耳不聞", "平分秋色", "名副其實"], "a": 1, "why": "「充耳不聞」指有意不聽別人的意見。"}, {"cat": "成語", "src": "第1回", "q": "兩隊實力相當，最後各得一分。可說兩隊？", "opts": ["四面楚歌", "牛刀割雞", "平分秋色", "宜室宜家"], "a": 2, "why": "「平分秋色」比喻雙方各占一半，不分上下。"}, {"cat": "成語", "src": "第1回", "q": "這個稱號與他的實際表現完全符合，最適合？", "opts": ["名副其實", "百折不撓", "走馬看花", "水到渠成"], "a": 0, "why": "「名副其實」指名稱或名聲與實際相符合。"}, {"cat": "成語", "src": "第1回", "q": "遇到困難仍堅持到底，屢敗屢試，應用哪個成語？", "opts": ["孤假虎威", "百折不撓", "東山再起", "四面楚歌"], "a": 1, "why": "「百折不撓」指意志堅強，受挫也不退縮。"}, {"cat": "成語", "src": "第1回", "q": "只匆匆看過展覽，沒有仔細欣賞，可以說？", "opts": ["走馬看花", "見微知著", "水到渠成", "品頭論足"], "a": 0, "why": "「走馬看花」指粗略觀看，不深入了解。"}, {"cat": "成語", "src": "第1回", "q": "同學對別人的穿著不停批評，最適合形容？", "opts": ["品頭論足", "宜室宜家", "手不釋卷", "才高八斗"], "a": 0, "why": "「品頭論足」比喻對人或事多方挑剔議論。"}, {"cat": "成語", "src": "第1回", "q": "閱讀時只要看到小線索，就推知整件事可能的發展。這是？", "opts": ["見微知著", "四面楚歌", "牛刀割雞", "毛骨悚然"], "a": 0, "why": "「見微知著」由細微跡象推知事物的發展。"}, {"cat": "成語", "src": "第1回", "q": "事情條件成熟後，自然順利完成，適合用？", "opts": ["水到渠成", "名副其實", "狐假虎威", "品頭論足"], "a": 0, "why": "「水到渠成」比喻條件具備，事情自然成功。"}, {"cat": "成語", "src": "第2回", "q": "即使是很優秀的人，也難免會有失誤。最適合？", "opts": ["智者千慮，必有一失", "一言九鼎", "暗箭傷人", "新亭對泣"], "a": 0, "why": "「智者千慮，必有一失」提醒人再聰明也可能犯錯。"}, {"cat": "成語", "src": "第2回", "q": "班長答應的事一定做到，說話極有分量，可形容？", "opts": ["一言九鼎", "穿井下石", "如魚得水", "巴蛇吞象"], "a": 0, "why": "「一言九鼎」形容一句話有極重的分量。"}, {"cat": "成語", "src": "第2回", "q": "有人趁同學受挫時又加以打擊，這是？", "opts": ["落井下石", "甘拜下風", "如魚得水", "拍案叫絕"], "a": 0, "why": "「落井下石」比喻乘人危難時加以陷害。"}, {"cat": "成語", "src": "第2回", "q": "加入合適的球隊後，他終於能充分發揮專長。可說？", "opts": ["如魚得水", "杯弓蛇影", "食古不化", "空穴來風"], "a": 0, "why": "「如魚得水」比喻得到適合自己的環境或得力的助力。"}, {"cat": "成語", "src": "第2回", "q": "觀眾看到精采表演，忍不住拍桌讚嘆。這是？", "opts": ["拍案叫絕", "一言九鼎", "甘拜下風", "雨腳春樹"], "a": 0, "why": "「拍案叫絕」形容非常讚賞。"}, {"cat": "成語", "src": "第2回", "q": "他總是死守舊方法，不知依情況變通。最貼切？", "opts": ["食古不化", "勝之不武", "單刀直入", "仁心仁術"], "a": 0, "why": "「食古不化」指拘泥古法而不知變通。"}, {"cat": "成語", "src": "第3回", "q": "他自以為天下第一，根本不把其他人的成就放在眼裡。", "opts": ["夜郎自大", "不拘小節", "水泄不通", "火傘高張"], "a": 0, "why": "「夜郎自大」形容見識狹窄卻妄自尊大。"}, {"cat": "成語", "src": "第3回", "q": "面對突如其來的壞消息，他表情依然平靜。", "opts": ["不動聲色", "刻舟求劍", "匹夫之勇", "投桃報李"], "a": 0, "why": "「不動聲色」指不流露內心情緒。"}, {"cat": "成語", "src": "第3回", "q": "明明船已經移動，卻還依原位置找落水的東西。這是？", "opts": ["刻舟求劍", "夜郎自大", "水泄不通", "不拘小節"], "a": 0, "why": "「刻舟求劍」比喻拘泥成法，不知情況已改變。"}, {"cat": "成語", "src": "第3回", "q": "會場人擠人，連走道都無法通過。", "opts": ["水泄不通", "火傘高張", "夜郎自大", "投桃報李"], "a": 0, "why": "「水泄不通」形容非常擁擠或包圍嚴密。"}, {"cat": "成語", "src": "第4回", "q": "這位畫家年輕時默默無聞，直到六十歲才展露傑出成就。", "opts": ["大器晚成", "大快朵頤", "反躬自省", "不惑之年"], "a": 0, "why": "「大器晚成」指卓越人才較晚才成就事業。"}, {"cat": "成語", "src": "第4回", "q": "事情失敗後，他不先責怪別人，而是反省自己的問題。", "opts": ["反躬自省", "如火如荼", "行雲流水", "見風使舵"], "a": 0, "why": "「反躬自省」指回過頭來反省自己。"}, {"cat": "成語", "src": "第4回", "q": "看到滿桌佳餚，大家開心地大吃一頓。", "opts": ["大快朵頤", "大器晚成", "反躬自省", "見風使舵"], "a": 0, "why": "「大快朵頤」指痛快地大吃。"}, {"cat": "成語", "src": "第4回", "q": "文章流暢自然、毫無滯礙，最適合形容？", "opts": ["行雲流水", "見風使舵", "不惑之年", "功成不居"], "a": 0, "why": "「行雲流水」形容文章或動作自然流暢。"}, {"cat": "成語", "src": "第5回", "q": "老師提醒：不要把自己的意見硬加到別人身上。這是？", "opts": ["己所不欲，勿施於人", "文過飾非", "趨炎附勢", "別出心裁"], "a": 0, "why": "教材第5回有「己所不欲，勿施於人」：自己不願接受的事，也不要施加於人。"}, {"cat": "成語", "src": "第5回", "q": "他犯錯後不願承認，反而找藉口掩飾。", "opts": ["文過飾非", "毛遂自薦", "相提並論", "淺斟低唱"], "a": 0, "why": "「文過飾非」指掩飾過失、錯誤。"}, {"cat": "成語", "src": "第5回", "q": "比賽需要代表時，他主動站出來推薦自己。", "opts": ["毛遂自薦", "別出心裁", "趨炎附勢", "相提並論"], "a": 0, "why": "「毛遂自薦」比喻主動推薦自己。"}, {"cat": "成語", "src": "第5回", "q": "這個海報構想與眾不同，很有創意。", "opts": ["別出心裁", "文過飾非", "眉飛色舞", "渾然不覺"], "a": 0, "why": "「別出心裁」指另有巧妙、獨特的構思。"}, {"cat": "成語", "src": "第5回", "q": "有人只巴結有權勢的人，對弱者卻很冷淡。", "opts": ["趨炎附勢", "毛遂自薦", "相提並論", "游手好閒"], "a": 0, "why": "「趨炎附勢」指依附有權勢的人。"}, {"cat": "成語", "src": "第6回", "q": "他總把別人的好意視為理所當然，缺少感謝。", "opts": ["人之常情", "因噎廢食", "理所當然", "刻骨銘心"], "a": 2, "why": "「理所當然」指按道理應該如此；題幹是批評把善意當成必然。"}, {"cat": "成語", "src": "第6回", "q": "因為上次游泳嗆到水，他就決定以後完全不碰水。", "opts": ["因噎廢食", "守株待兔", "曲肱而枕", "車水馬龍"], "a": 0, "why": "「因噎廢食」比喻因害怕小挫折或問題，連應做的事也不做。"}, {"cat": "成語", "src": "第6回", "q": "他沒有主動努力，只希望好運自己上門。", "opts": ["守株待兔", "車水馬龍", "信口雌黃", "指桑罵槐"], "a": 0, "why": "「守株待兔」比喻拘守偶然的經驗或不勞而獲。"}, {"cat": "成語", "src": "第6回", "q": "放學時校門口車輛來往不絕。", "opts": ["車水馬龍", "河清海晏", "長驅直入", "高風亮節"], "a": 0, "why": "「車水馬龍」形容車馬往來繁盛、熱鬧。"}, {"cat": "成語", "src": "第6回", "q": "他故意指責甲同學，實際上卻是在暗罵乙同學。", "opts": ["指桑罵槐", "信口雌黃", "守株待兔", "抱柱之信"], "a": 0, "why": "「指桑罵槐」指表面罵甲，實際罵乙。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「想奪取最高權力」？", "opts": ["退避三舍", "臥薪嘗膽", "三令五申", "問鼎"], "a": 3, "why": "「問鼎」：覬覦最高權位。相關人物／背景：周王室。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「失信會招致嚴重後果」？", "opts": ["破釜沉舟", "鴻門宴", "烽火戲諸侯", "紙上談兵"], "a": 2, "why": "「烽火戲諸侯」：為博褒姒一笑濫用烽火。相關人物／背景：周幽王。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「袖手旁觀」？", "opts": ["草木皆兵", "作壁上觀", "四面楚歌", "投筆從戎"], "a": 1, "why": "「作壁上觀」：在旁觀看而不參與。相關人物／背景：楚漢相爭。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「帝王的尊稱」？", "opts": ["九五之尊", "東山再起", "望梅止渴", "三顧茅廬"], "a": 0, "why": "「九五之尊」：九五與帝王尊位相關。相關人物／背景：帝王。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「主動退讓避免衝突」？", "opts": ["割雞焉用牛刀", "不入虎穴，焉得虎子", "黔驢技窮", "退避三舍"], "a": 3, "why": "「退避三舍」：為履行承諾而後退三舍。相關人物／背景：晉文公重耳。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「刻苦自勵不忘目標」？", "opts": ["桃李滿天下", "橘化為枳", "臥薪嘗膽", "項莊舞劍"], "a": 2, "why": "「臥薪嘗膽」：忍辱自勵以圖復國。相關人物／背景：越王勾踐。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「再三告誡」？", "opts": ["華佗再世", "三令五申", "江東父老", "杏林春暖"], "a": 1, "why": "「三令五申」：反覆說明軍令。相關人物／背景：孫武。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「空談理論不切實際」？", "opts": ["紙上談兵", "問鼎", "烽火戲諸侯", "作壁上觀"], "a": 0, "why": "「紙上談兵」：只會空談兵法卻缺乏實戰應變。相關人物／背景：趙括。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「下定決心不留退路」？", "opts": ["九五之尊", "退避三舍", "臥薪嘗膽", "破釜沉舟"], "a": 3, "why": "「破釜沉舟」：打破鍋、鑿沉船以示決心。相關人物／背景：項羽。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「表面宴請實有陰謀」？", "opts": ["紙上談兵", "破釜沉舟", "鴻門宴", "三令五申"], "a": 2, "why": "「鴻門宴」：宴會暗藏殺機。相關人物／背景：項羽與劉邦。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「陷入孤立無援的困境」？", "opts": ["草木皆兵", "四面楚歌", "鴻門宴", "投筆從戎"], "a": 1, "why": "「四面楚歌」：四面傳來楚歌而軍心動搖。相關人物／背景：項羽。"}, {"cat": "典故", "src": "讀典故知文史", "q": "哪個典故最符合這個意思：「棄文從軍」？", "opts": ["投筆從戎", "東山再起", "望梅止渴", "三顧茅廬"], "a": 0, "why": "「投筆從戎」：放下筆從軍。相關人物／背景
